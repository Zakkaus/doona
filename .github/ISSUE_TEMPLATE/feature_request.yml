name: Feature request
description: Propose a change to doona.
title: 'feature: '
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the user problem this request would solve.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: Describe the proposed behavior or change.
    validations:
      required: true
  - type: input
    id: page
    attributes:
      label: Page
      description: Name the page this request affects.
    validations:
      required: true
