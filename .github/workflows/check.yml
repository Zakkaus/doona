name: Check

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      lane: ${{ steps.route.outputs.lane }}
      matrix: ${{ steps.route.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: route
        run: node tools/ci-changes.mjs

  check-lite:
    needs: [changes]
    if: needs.changes.outputs.lane == 'docs'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm check:i18n

  # Static checks, unit tests and the bundle budget: a few minutes, independent of the browsers.
  check:
    needs: [changes]
    if: needs.changes.outputs.lane == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm check:i18n
      - run: pnpm format:check
      - run: pnpm test:coverage
      - run: pnpm check:gen
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/lcov.info
          if-no-files-found: error
      - run: pnpm build
      - run: pnpm check:size

  # The browser suite is most of the run's time, so it is split over parallel runners; each builds its own dist.
  e2e:
    needs: [changes]
    if: needs.changes.outputs.lane == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The image ships the browsers and their OS packages; installing those per run took up to 21 minutes on some runners.
    # Bump the tag together with @playwright/test (the step below fails on a mismatch).
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --init --ipc=host
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Match the container to @playwright/test
        run: test "$(node -p "require('./package.json').devDependencies['@playwright/test']")" = "${PLAYWRIGHT_VERSION}"
        env:
          PLAYWRIGHT_VERSION: 1.63.0
      - run: pnpm e2e --shard=${{ matrix.shard }}/4
        env:
          DOONA_E2E_WEBKIT: '1'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.shard }}
          path: test-results/
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: blob-report-${{ matrix.shard }}
          path: blob-report/
          if-no-files-found: error
          retention-days: 1

  merge-reports:
    if: ${{ !cancelled() && needs.e2e.result != 'skipped' }}
    needs: [e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          path: all-blob-reports
          pattern: blob-report-*
          merge-multiple: true
      - name: Require blob reports from the browser shards
        run: |
          shopt -s nullglob
          blobs=(all-blob-reports/*.zip)
          if [ "${#blobs[@]}" -eq 0 ]; then
            echo '::error::The browser jobs ran but produced no blob reports; inspect the failed e2e steps.'
            exit 1
          fi
      - run: pnpm exec playwright merge-reports --reporter html ./all-blob-reports
      - uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: error
          retention-days: 14

  ci-ok:
    needs: [changes, check-lite, check, e2e, merge-reports]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Require the selected lane
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          node <<'JS'
          const needs = JSON.parse(process.env.NEEDS);
          const lane = needs.changes.outputs.lane;
          const selected = lane === 'docs' ? ['check-lite'] : lane === 'full' ? ['check', 'e2e', 'merge-reports'] : [];
          const lanes = ['check-lite', 'check', 'e2e', 'merge-reports'];
          const ok = needs.changes.result === 'success' && selected.length > 0 &&
            ['true', 'false'].includes(needs.changes.outputs.matrix) &&
            lanes.every(job => needs[job].result === (selected.includes(job) ? 'success' : 'skipped'));
          if (!ok) {
            console.error('CI lane did not complete successfully', needs);
            process.exit(1);
          }
          JS
