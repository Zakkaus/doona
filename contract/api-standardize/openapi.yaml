components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: |
        Bearer authentication is mandatory on every request except CORS preflights
        whenever a deployment secret is set.
        The anonymous security alternative is permitted only on an explicitly
        secretless loopback listener, never as a fallback for invalid credentials.
        Native permissions are expressed by x-permission; see API Configuration.
  headers:
    NoStore:
      description: Native responses are not cacheable.
      required: true
      schema:
        type: string
        const: no-store
    NoSniff:
      description: Prevent MIME-type sniffing.
      required: true
      schema:
        type: string
        const: nosniff
    ETag:
      description: Quoted group configuration revision.
      required: true
      schema:
        type: string
        minLength: 1
  parameters:
    '0':
      name: type
      in: query
      schema:
        type: string
        enum:
          - tcp
          - udp
          - all
        default: all
    '1':
      name: src
      in: query
      description: Exact source IP literal, without a port; applied with type before limit. Totals and truncated describe only matching visible entries.
      schema:
        $ref: '#/components/schemas/IpAddress'
      example: 192.168.1.100
    Detail:
      name: detail
      in: query
      schema:
        type: string
        enum:
          - summary
          - full
        default: summary
      example: full
    Limit1000:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 1000
        default: 100
      example: 100
    Cursor:
      name: cursor
      in: query
      description: |
        Opaque cursor bound to the resource, running adapter instance, filters,
        and retained snapshot. Restart, changed filters, or snapshot expiry or
        eviction invalidates it. GET /flows returns 410 snapshot_expired;
        GET /nodes, GET /providers and GET /dns/cache return 400 invalid_request
        for a cursor that is unknown or no longer valid. Discard it and restart
        the page walk without a cursor; never silently continue against a new snapshot.
      schema:
        type: string
        minLength: 1
    GroupId:
      name: groupId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
      example: group-proxy
    ConnectionId:
      name: connection_id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
      example: tcp-01HZX4K8W5
    FlowId:
      name: flow_id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
      example: flow-23
    DnsEntryId:
      name: entry_id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
      example: dns-entry-01HZX4K8W5
    OperationId:
      name: id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
      example: op-01HZX4K8W7
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema:
        type: string
        minLength: 1
      example: '"17"'
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema:
        type: string
        minLength: 1
    LastEventId:
      name: Last-Event-ID
      in: header
      required: false
      schema:
        type: string
        minLength: 1
      example: instance-7:123
    ProviderId:
      name: id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
      example: provider-a
  responses:
    '404':
      description: Unknown source ID or unavailable configuration readback
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
        X-Content-Type-Options:
          $ref: '#/components/headers/NoSniff'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            resource_not_found:
              value:
                error:
                  code: resource_not_found
                  message: Configuration source not found.
                request_id: request-source-1
              x-headers:
                Content-Type: application/json
                Cache-Control: no-store
                X-Content-Type-Options: nosniff
            capability_not_supported:
              value:
                error:
                  code: capability_not_supported
                  message: Configuration readback is unavailable.
                request_id: request-source-2
              x-headers:
                Content-Type: application/json
                Cache-Control: no-store
                X-Content-Type-Options: nosniff
    OperationAccepted:
      description: Operation accepted
      headers:
        Location:
          description: Operation status URL; equal to body href.
          required: true
          schema:
            type: string
            pattern: ^/api/v1/operations/[^/]+$
        Retry-After:
          description: Positive polling floor in seconds.
          required: true
          schema:
            type: integer
            minimum: 1
        Cache-Control:
          $ref: '#/components/headers/NoStore'
        X-Content-Type-Options:
          $ref: '#/components/headers/NoSniff'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/OperationAccepted'
    BadRequest:
      description: Malformed parameters or request shape
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
        X-Content-Type-Options:
          $ref: '#/components/headers/NoSniff'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            invalid_request:
              value:
                error:
                  code: invalid_request
                  message: A request parameter is invalid.
                  details: null
                request_id: request-01HZX4K8W6
              x-headers:
                Content-Type: application/json
                Cache-Control: no-store
                X-Content-Type-Options: nosniff
    Unauthorized:
      description: Credentials are missing or invalid
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
        X-Content-Type-Options:
          $ref: '#/components/headers/NoSniff'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            authentication_required:
              value:
                error:
                  code: authentication_required
                  message: Valid bearer credentials are required.
                  details: null
                request_id: request-01HZX4K8W6
              x-headers:
                Content-Type: application/json
                Cache-Control: no-store
                X-Content-Type-Options: nosniff
    Forbidden:
      description: Authenticated caller lacks the required permission
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
        X-Content-Type-Options:
          $ref: '#/components/headers/NoSniff'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            permission_denied:
              value:
                error:
                  code: permission_denied
                  message: The caller lacks the required permission.
                  details: null
                request_id: request-01HZX4K8W6
              x-headers:
                Content-Type: application/json
                Cache-Control: no-store
                X-Content-Type-Options: nosniff
    NotFound:
      description: Resource/action unavailable, absent, expired, or concealed
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
        X-Content-Type-Options:
          $ref: '#/components/headers/NoSniff'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            resource_not_found:
              value:
                error:
                  code: resource_not_found
                  message: The requested resource was not found.
                  details: null
                request_id: request-01HZX4K8W6
              x-headers:
                Content-Type: application/json
                Cache-Control: no-store
                X-Content-Type-Options: nosniff
            capability_not_supported:
              value:
                error:
                  code: capability_not_supported
                  message: The requested resource or action is unavailable.
                  details: null
                request_id: request-01HZX4K8W6
              x-headers:
                Content-Type: application/json
                Cache-Control: no-store
                X-Content-Type-Options: nosniff
    Conflict:
      $ref: '#/components/responses/ErrorResponseCommon'
      description: State, idempotency, cursor, or coherent-snapshot conflict
    Gone:
      $ref: '#/components/responses/ErrorResponseCommon'
      description: Flow or paginated snapshot retention expired
    PreconditionFailed:
      $ref: '#/components/responses/ErrorResponseCommon'
      description: If-Match does not equal the current configuration revision or on-disk source content hash
    TooLarge:
      $ref: '#/components/responses/ErrorResponseCommon'
      description: Request size or advertised fan-out limit exceeded
    UnsupportedMediaType:
      $ref: '#/components/responses/ErrorResponseCommon'
      description: Unsupported request Content-Type
    Unprocessable:
      $ref: '#/components/responses/ErrorResponseCommon'
      description: Unsupported field, value, or transition, or error diagnostics from configuration replacement validation
    PreconditionRequired:
      $ref: '#/components/responses/ErrorResponseCommon'
      description: Required If-Match is absent
    RateLimited:
      description: Advertised request or operation rate exceeded
      headers:
        Retry-After:
          description: Retry delay in seconds.
          required: true
          schema:
            type: integer
            minimum: 1
        Cache-Control:
          $ref: '#/components/headers/NoStore'
        X-Content-Type-Options:
          $ref: '#/components/headers/NoSniff'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            rate_limited:
              value:
                error:
                  code: rate_limited
                  message: The request rate limit was reached.
                  details: null
                request_id: request-01HZX4K8W6
              x-headers:
                Content-Type: application/json
                Retry-After: 1
                Cache-Control: no-store
                X-Content-Type-Options: nosniff
    Unavailable:
      description: Bounded queue or required runtime component unavailable
      headers:
        Retry-After:
          description: Retry delay in seconds when retryable.
          schema:
            type: integer
            minimum: 1
        Cache-Control:
          $ref: '#/components/headers/NoStore'
        X-Content-Type-Options:
          $ref: '#/components/headers/NoSniff'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            temporarily_unavailable:
              value:
                error:
                  code: temporarily_unavailable
                  message: A required runtime component is unavailable.
                  details: null
                request_id: request-01HZX4K8W6
              x-headers:
                Content-Type: application/json
                Retry-After: 1
                Cache-Control: no-store
                X-Content-Type-Options: nosniff
    ErrorResponseCommon:
      description: Native API error
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
        X-Content-Type-Options:
          $ref: '#/components/headers/NoSniff'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    EventCursorExpired:
      description: Last-Event-ID cannot be replayed (event_cursor_expired); sent before any 200 stream opens. Drop the cursor, reconnect without it and establish a new baseline.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
        X-Content-Type-Options:
          $ref: '#/components/headers/NoSniff'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            event_cursor_expired:
              value:
                error:
                  code: event_cursor_expired
                  message: Event cursor is older than the retained window; reconnect without it.
                  details: null
                request_id: request-01HZX4K8W6
              x-headers:
                Content-Type: application/json
                Cache-Control: no-store
                X-Content-Type-Options: nosniff
  schemas:
    EmptyObject:
      type: object
      additionalProperties: false
      maxProperties: 0
    SafeUInt:
      type: integer
      minimum: 0
      maximum: 9007199254740991
    NullableSafeUInt:
      type:
        - integer
        - 'null'
      minimum: 0
      maximum: 9007199254740991
    UInt64:
      type: string
      maxLength: 20
      not:
        pattern: '[^0-9]'
      pattern: ^(?:0|[1-9][0-9]{0,18}|1[0-7][0-9]{18}|18[0-3][0-9]{17}|184[0-3][0-9]{16}|1844[0-5][0-9]{15}|18446[0-6][0-9]{14}|184467[0-3][0-9]{13}|1844674[0-3][0-9]{12}|184467440[0-6][0-9]{10}|1844674407[0-2][0-9]{9}|18446744073[0-6][0-9]{8}|1844674407370[0-8][0-9]{6}|18446744073709[0-4][0-9]{5}|184467440737095[0-4][0-9]{4}|18446744073709550[0-9]{3}|18446744073709551[0-5][0-9]{2}|1844674407370955160[0-9]|1844674407370955161[0-4]|18446744073709551615)$
      description: Canonical unsigned 64-bit decimal string, 0 through 18446744073709551615. Never a JSON number.
    NullableUInt64:
      oneOf:
        - type: 'null'
        - $ref: '#/components/schemas/UInt64'
    Timestamp:
      type: string
      format: date-time
    NullableTimestamp:
      type:
        - string
        - 'null'
      format: date-time
    ErrorCode:
      type: string
      description: Closed catalogue of HTTP error codes (docs/errors.md keeps the prose). Adding a code is a contract change; adapters never invent codes. Errors embedded in resources (operation.error, datapath.errors, lifecycle.last_error) carry an adapter-defined code and stay plain SafeError.
      enum:
        - invalid_request
        - authentication_required
        - permission_denied
        - resource_not_found
        - capability_not_supported
        - state_conflict
        - idempotency_conflict
        - event_cursor_expired
        - snapshot_unavailable
        - snapshot_expired
        - flow_expired
        - stale_revision
        - request_too_large
        - unsupported_media_type
        - unsupported_value
        - precondition_required
        - rate_limited
        - temporarily_unavailable
    SafeError:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          minLength: 1
        message:
          type: string
          minLength: 1
        details:
          type:
            - object
            - 'null'
      description: Safe structured error; never raw engine output.
    ApiError:
      allOf:
        - $ref: '#/components/schemas/SafeError'
        - type: object
          properties:
            code:
              $ref: '#/components/schemas/ErrorCode'
      description: HTTP error body; the code comes from ErrorCode.
    ErrorResponse:
      type: object
      required:
        - error
        - request_id
      properties:
        error:
          $ref: '#/components/schemas/ApiError'
        request_id:
          type:
            - string
            - 'null'
    Discovery:
      type: object
      required:
        - name
        - status
        - api_major
        - base_path
        - links
      properties:
        name:
          type: string
          const: dae/honk-native
        status:
          type: string
          const: draft
        api_major:
          type: integer
          const: 1
        base_path:
          type: string
          const: /api/v1
        links:
          type: object
          required:
            - version
            - capabilities
            - config
            - config_validate
            - runtime
            - runtime_outbounds
            - traffic_history
            - memory_history
            - runtime_mode
            - logs
            - providers
            - rules
            - operations
          properties:
            version:
              type: string
              const: /api/v1/version
            capabilities:
              type: string
              const: /api/v1/capabilities
            config:
              type: string
              const: /api/v1/config
            config_validate:
              type: string
              const: /api/v1/config/validate
            runtime:
              type: string
              const: /api/v1/runtime
            runtime_outbounds:
              type: string
              const: /api/v1/runtime/outbounds
            traffic_history:
              type: string
              const: /api/v1/runtime/traffic/history
            memory_history:
              type: string
              const: /api/v1/runtime/memory/history
            logs:
              type: string
              const: /api/v1/logs
            providers:
              type: string
              const: /api/v1/providers
            rules:
              type: string
              const: /api/v1/rules
            runtime_mode:
              type: string
              const: /api/v1/runtime/mode
            operations:
              type: string
              const: /api/v1/operations/{id}
    Version:
      type: object
      required:
        - api
        - engine
      properties:
        api:
          type: object
          required:
            - name
            - major
            - status
          properties:
            name:
              type: string
              const: dae/honk-native
            major:
              type: integer
              const: 1
            status:
              type: string
              const: draft
        engine:
          type: object
          required:
            - name
            - version
          properties:
            name:
              type: string
              minLength: 1
            version:
              type: string
              minLength: 1
        build:
          oneOf:
            - type: 'null'
            - type: object
              required:
                - revision
                - target
                - built_at
              properties:
                revision:
                  type:
                    - string
                    - 'null'
                target:
                  type:
                    - string
                    - 'null'
                built_at:
                  $ref: '#/components/schemas/NullableTimestamp'
    AvailableResource:
      type: object
      required:
        - available
      properties:
        available:
          type: boolean
    Capabilities:
      type: object
      required:
        - observed_at
        - profiles
        - limits
        - resources
      properties:
        observed_at:
          $ref: '#/components/schemas/Timestamp'
        profiles:
          type: array
          uniqueItems: true
          items:
            type: string
            enum:
              - base
              - full_transparency
        limits:
          type: object
          required:
            - max_request_target_bytes
            - max_header_bytes
            - max_json_body_bytes
          properties:
            max_request_target_bytes:
              type: integer
              minimum: 1
            max_header_bytes:
              type: integer
              minimum: 1
            max_json_body_bytes:
              type: integer
              minimum: 1
        resources:
          type: object
          required:
            - config
            - config_validate
            - runtime
            - runtime_memory
            - runtime_outbounds
            - traffic_history
            - memory_history
            - runtime_mode
            - datapath
            - nodes
            - providers
            - groups
            - probes
            - connections
            - flows
            - routing_trace
            - rules
            - events
            - logs
            - dns_query
            - dns_cache
            - dns_log
            - runtime_settings
            - operations
            - reload
            - suspend
            - resume
          properties:
            config:
              type: object
              required:
                - available
              if:
                properties:
                  available:
                    const: true
              then:
                required:
                  - content
                  - writable
                  - max_bytes
                  - max_sources
              properties:
                available:
                  type: boolean
                content:
                  type: boolean
                  default: false
                  description: Visibility flag permitting optional source text; not permission to disclose secrets. False by default.
                writable:
                  type: boolean
                  description: |
                    Server-wide switch for replacing accepted sources under control;
                    individual sources may still be read-only. True requires full
                    validation and reload operations, including resources.reload.available
                    and resources.operations.available. Independent of content visibility
                    and the optional dry-run endpoint.
                max_bytes:
                  $ref: '#/components/schemas/SafeUInt'
                  minimum: 1
                  description: Maximum UTF-8 bytes in replacement content; the shared JSON body ceiling applies independently.
                max_sources:
                  $ref: '#/components/schemas/SafeUInt'
                  minimum: 1
                  description: Maximum complete effective source set the adapter can expose; never silently truncate it.
            config_validate:
              type: object
              required:
                - available
              if:
                properties:
                  available:
                    const: true
              then:
                required:
                  - modes
                  - max_bytes
                  - max_sources
              properties:
                available:
                  type: boolean
                modes:
                  type: array
                  minItems: 1
                  uniqueItems: true
                  items:
                    $ref: '#/components/schemas/ConfigValidationMode'
                max_bytes:
                  $ref: '#/components/schemas/SafeUInt'
                  minimum: 1
                  description: Maximum total UTF-8 source bytes, including local dependencies in full mode; the shared JSON body ceiling also applies.
                max_sources:
                  $ref: '#/components/schemas/SafeUInt'
                  minimum: 1
                  description: Maximum sources per validation, including local dependencies in full mode.
            runtime:
              $ref: '#/components/schemas/AvailableResource'
            runtime_memory:
              type: object
              required:
                - available
              if:
                properties:
                  available:
                    const: true
              then:
                required:
                  - metrics
              properties:
                available:
                  type: boolean
                metrics:
                  type: array
                  uniqueItems: true
                  items:
                    type: string
                    enum:
                      - process.rss_bytes
                      - cgroup.current_bytes
                      - cgroup.limit_bytes
                      - cgroup.events.high
                      - cgroup.events.oom
                      - cgroup.events.oom_kill
                      - kernel.ebpf_bytes
            runtime_outbounds:
              $ref: '#/components/schemas/AvailableResource'
            traffic_history:
              type: object
              required:
                - available
              if:
                properties:
                  available:
                    const: true
              then:
                required:
                  - max_window_seconds
                  - max_points
              properties:
                available:
                  type: boolean
                max_window_seconds:
                  $ref: '#/components/schemas/SafeUInt'
                  minimum: 1
                  description: Maximum look-back window in seconds; not a guarantee against bounded-ring eviction.
                max_points:
                  $ref: '#/components/schemas/SafeUInt'
                  minimum: 1
                  description: Maximum returned samples per history request.
            memory_history:
              type: object
              required:
                - available
              if:
                properties:
                  available:
                    const: true
              then:
                required:
                  - max_window_seconds
                  - max_points
              properties:
                available:
                  type: boolean
                max_window_seconds:
                  $ref: '#/components/schemas/SafeUInt'
                  minimum: 1
                  description: Maximum look-back window in seconds; not a guarantee against bounded-ring eviction.
                max_points:
                  $ref: '#/components/schemas/SafeUInt'
                  minimum: 1
                  description: Maximum returned samples per history request.
            runtime_mode:
              type: object
              required:
                - available
              if:
                properties:
                  available:
                    const: true
              then:
                required:
                  - modes
              properties:
                available:
                  type: boolean
                modes:
                  type: array
                  uniqueItems: true
                  minItems: 1
                  items:
                    $ref: '#/components/schemas/OutboundMode'
                  description: The modes PUT /runtime/mode accepts; rule is always one of them.
            datapath:
              type: object
              required:
                - available
              if:
                properties:
                  available:
                    const: true
              then:
                required:
                  - kinds
                  - details
              properties:
                available:
                  type: boolean
                kinds:
                  type: array
                  uniqueItems: true
                  items:
                    $ref: '#/components/schemas/DatapathKind'
                details:
                  type: array
                  uniqueItems: true
                  items:
                    type: string
                    enum:
                      - attachments
                      - maps
            nodes:
              $ref: '#/components/schemas/AvailableResource'
            providers:
              type: object
              required:
                - available
              if:
                properties:
                  available:
                    const: true
              then:
                required:
                  - can_refresh
                  - max_page_size
              properties:
                available:
                  type: boolean
                can_refresh:
                  type: boolean
                  description: Refresh is implemented; individual provider kinds may still be unsupported. Requires operations.available.
                max_page_size:
                  $ref: '#/components/schemas/SafeUInt'
                  minimum: 1
                  maximum: 1000
            groups:
              type: object
              required:
                - available
              if:
                properties:
                  available:
                    const: true
              then:
                required:
                  - config_patch
                  - selection
                  - max_patch_operations
              properties:
                available:
                  type: boolean
                config_patch:
                  type: boolean
                selection:
                  type: boolean
                max_patch_operations:
                  type: integer
                  minimum: 1
            probes:
              type: object
              required:
                - available
              if:
                properties:
                  available:
                    const: true
              then:
                required:
                  - targets
                  - kinds
                  - purposes
                  - transports
                  - ip_versions
                  - limits
              properties:
                available:
                  type: boolean
                targets:
                  type: array
                  uniqueItems: true
                  items:
                    type: string
                    enum:
                      - node
                      - group
                kinds:
                  type: array
                  uniqueItems: true
                  items:
                    $ref: '#/components/schemas/ProbeKind'
                purposes:
                  type: array
                  uniqueItems: true
                  items:
                    type: string
                    enum:
                      - data
                      - dns
                transports:
                  type: array
                  uniqueItems: true
                  items:
                    $ref: '#/components/schemas/Transport'
                ip_versions:
                  type: array
                  uniqueItems: true
                  items:
                    $ref: '#/components/schemas/IpVersion'
                limits:
                  $ref: '#/components/schemas/ProbeLimits'
            connections:
              type: object
              required:
                - available
              if:
                properties:
                  available:
                    const: true
              then:
                required:
                  - can_close
                  - max_bulk_close
              properties:
                available:
                  type: boolean
                can_close:
                  type: boolean
                  description: Whether userspace-owned connections can be closed; false makes both connection DELETE endpoints return 404 capability_not_supported.
                max_bulk_close:
                  $ref: '#/components/schemas/SafeUInt'
                  minimum: 1
                  description: Maximum matching live entries, including non-closable entries, per bulk close; used only when can_close is true. Excess returns 413 request_too_large before any connection is closed.
            flows:
              type: object
              required:
                - available
              if:
                properties:
                  available:
                    const: true
              then:
                required:
                  - recording
                  - scopes
                  - max_flows
                  - max_steps_per_flow
                  - retention_seconds
                  - snapshot_ttl_seconds
                  - max_page_size
              properties:
                available:
                  type: boolean
                recording:
                  type: string
                  enum:
                    - 'off'
                    - 'on'
                    - sampled
                scopes:
                  type: array
                  uniqueItems: true
                  items:
                    $ref: '#/components/schemas/FlowScope'
                max_flows:
                  type: integer
                  minimum: 1
                max_steps_per_flow:
                  type: integer
                  minimum: 1
                retention_seconds:
                  type: integer
                  minimum: 0
                snapshot_ttl_seconds:
                  type: integer
                  minimum: 1
                max_page_size:
                  type: integer
                  minimum: 1
                  maximum: 1000
            routing_trace:
              type: object
              required:
                - available
              if:
                properties:
                  available:
                    const: true
              then:
                required:
                  - resolve_modes
                  - max_addresses
                  - max_rule_steps
                  - timeout_ms
                  - per_principal_requests_per_minute
                  - global_requests_per_minute
              properties:
                available:
                  type: boolean
                resolve_modes:
                  type: array
                  uniqueItems: true
                  items:
                    type: string
                    enum:
                      - none
                      - live
                max_addresses:
                  type: integer
                  minimum: 1
                max_rule_steps:
                  type: integer
                  minimum: 1
                timeout_ms:
                  type: integer
                  minimum: 1
                per_principal_requests_per_minute:
                  type: integer
                  minimum: 1
                global_requests_per_minute:
                  type: integer
                  minimum: 1
            rules:
              type: object
              required:
                - available
              if:
                properties:
                  available:
                    const: true
              then:
                required:
                  - max_rules
              properties:
                available:
                  type: boolean
                max_rules:
                  $ref: '#/components/schemas/SafeUInt'
                  minimum: 1
                  description: Maximum complete rule dictionary size, including the fallback entry; never a truncation limit.
            events:
              type: object
              required:
                - available
              if:
                properties:
                  available:
                    const: true
              then:
                required:
                  - kinds
                  - retention_seconds
                  - max_buffered_events
                  - max_clients
                  - heartbeat_seconds
              properties:
                available:
                  type: boolean
                kinds:
                  type: array
                  uniqueItems: true
                  items:
                    $ref: '#/components/schemas/EventKind'
                retention_seconds:
                  type: integer
                  minimum: 0
                max_buffered_events:
                  type: integer
                  minimum: 1
                max_clients:
                  type: integer
                  minimum: 1
                heartbeat_seconds:
                  type: integer
                  minimum: 1
                  maximum: 15
            logs:
              type: object
              required:
                - available
              if:
                properties:
                  available:
                    const: true
              then:
                required:
                  - levels
                  - max_buffered_records
              properties:
                available:
                  type: boolean
                levels:
                  type: array
                  minItems: 1
                  uniqueItems: true
                  items:
                    $ref: '#/components/schemas/LogLevel'
                max_buffered_records:
                  $ref: '#/components/schemas/SafeUInt'
                  minimum: 1
                  description: Bounded replay buffer capacity, not a durable retention guarantee.
            dns_query:
              type: object
              required:
                - available
              if:
                properties:
                  available:
                    const: true
              then:
                required:
                  - record_types
                  - limits
              properties:
                available:
                  type: boolean
                record_types:
                  type: array
                  uniqueItems: true
                  items:
                    $ref: '#/components/schemas/DnsRecordType'
                limits:
                  $ref: '#/components/schemas/DnsQueryLimits'
            dns_cache:
              type: object
              required:
                - available
              if:
                properties:
                  available:
                    const: true
              then:
                required:
                  - read
                  - delete_entry
                  - delete_name
                  - flush
                  - entry_kinds
              properties:
                available:
                  type: boolean
                read:
                  type: boolean
                delete_entry:
                  type: boolean
                delete_name:
                  type: boolean
                flush:
                  type: boolean
                entry_kinds:
                  type: array
                  uniqueItems: true
                  items:
                    type: string
                    enum:
                      - positive
                      - negative
            dns_log:
              type: object
              required:
                - available
              if:
                properties:
                  available:
                    const: true
              then:
                required:
                  - max_records
                  - max_page_size
              properties:
                available:
                  type: boolean
                max_records:
                  $ref: '#/components/schemas/SafeUInt'
                  minimum: 1
                  description: Ring capacity in records; not a retention guarantee.
                max_page_size:
                  $ref: '#/components/schemas/SafeUInt'
                  minimum: 1
            runtime_settings:
              type: object
              required:
                - available
              if:
                properties:
                  available:
                    const: true
              then:
                required:
                  - fields
              properties:
                available:
                  type: boolean
                fields:
                  type: array
                  uniqueItems: true
                  description: The settings PATCH /runtime/settings accepts on this backend; others return 400.
                  items:
                    $ref: '#/components/schemas/RuntimeSettingField'
            operations:
              type: object
              required:
                - available
              if:
                properties:
                  available:
                    const: true
              then:
                required:
                  - retention_seconds
              properties:
                available:
                  type: boolean
                retention_seconds:
                  type: integer
                  minimum: 0
            reload:
              $ref: '#/components/schemas/AvailableResource'
            suspend:
              $ref: '#/components/schemas/AvailableResource'
            resume:
              $ref: '#/components/schemas/AvailableResource'
    EffectiveConfig:
      type: object
      required:
        - generation_id
        - revision
        - sources
        - diagnostics
        - secrets_redacted
      properties:
        generation_id:
          type: string
          minLength: 1
          description: Running generation whose accepted sources and diagnostics are returned.
        revision:
          type: string
          minLength: 1
          description: Opaque configuration revision used by Runtime.generation.config_revision and GroupSummary.config_revision; preserve without numeric parsing.
        sources:
          type: array
          items:
            $ref: '#/components/schemas/ConfigSource'
        diagnostics:
          type: array
          items:
            $ref: '#/components/schemas/ConfigDiagnostic'
        secrets_redacted:
          type: boolean
          description: True when content is withheld or paths, text, or diagnostic messages are redacted under visibility policy.
    ConfigSource:
      type: object
      required:
        - id
        - path
        - kind
        - content_sha256
        - bytes
        - writable
        - loaded_at
        - line_count
      properties:
        id:
          type: string
          minLength: 1
          description: Unique opaque source ID within this configuration snapshot; never a credential-bearing path or URL.
        path:
          type: string
          minLength: 1
          description: Display path only, replaced with <redacted> when hidden by visibility policy; not a file-access capability.
        kind:
          type: string
          enum:
            - main
            - include
            - subscription
            - generated
        content_sha256:
          type: string
          pattern: ^[0-9a-f]{64}$
          minLength: 64
          maxLength: 64
          description: Lowercase SHA-256 of the accepted source bytes before redaction; not necessarily the digest of displayed content.
        bytes:
          $ref: '#/components/schemas/SafeUInt'
          description: Accepted source size in bytes before redaction.
        writable:
          type: boolean
          description: |
            True only when server-wide editing is enabled and this source permits
            replacement by a control caller. False for engine-written includes,
            generated sources, and subscriptions; observe alone never grants writes.
        loaded_at:
          $ref: '#/components/schemas/Timestamp'
          description: Time these source bytes were accepted, not the current file modification time.
        content:
          type: string
          description: Optional dae text, only when resources.config.content is true; still subject to secret redaction. Use for editing only if its UTF-8 SHA-256 matches content_sha256.
        line_count:
          $ref: '#/components/schemas/SafeUInt'
          description: Lines in the accepted source before redaction; empty text has zero lines, and a final newline does not add an empty line.
      if:
        properties:
          kind:
            enum:
              - subscription
              - generated
        required:
          - kind
      then:
        properties:
          writable:
            const: false
    ConfigDiagnostic:
      type: object
      required:
        - level
        - source_id
        - line
        - column
        - span
        - code
        - message
      description: |
        Safe diagnostic for an accepted or candidate source, never raw parser output.
        Coordinates refer to the original source before redaction. Use null for
        unknown locations; do not fabricate positions from setting names.
      properties:
        level:
          type: string
          enum:
            - error
            - warning
            - info
        source_id:
          type: string
          minLength: 1
          description: Source ID in the effective snapshot, validation request, or source set being validated for replacement.
        line:
          $ref: '#/components/schemas/NullableSafeUInt'
          minimum: 1
          description: One-based line, or null if unknown.
        column:
          $ref: '#/components/schemas/NullableSafeUInt'
          minimum: 1
          description: One-based UTF-8 byte column, or null if unknown; not a character or UTF-16 offset.
        span:
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/ConfigDiagnosticSpan'
        code:
          type: string
          minLength: 1
          description: Adapter-defined diagnostic code, independent of the HTTP ErrorCode catalogue.
        message:
          type: string
          minLength: 1
          description: Safe operator-facing description; never source excerpts, credentials, private paths, or raw engine errors.
    ConfigDiagnosticSpan:
      type: object
      required:
        - start_line
        - start_column
        - end_line
        - end_column
      description: |
        One-based lines and UTF-8 byte columns; start inclusive, end exclusive.
        The end must not precede the start. A zero-width span is permitted.
        When line and column are known, they equal the span start.
      properties:
        start_line:
          $ref: '#/components/schemas/SafeUInt'
          minimum: 1
        start_column:
          $ref: '#/components/schemas/SafeUInt'
          minimum: 1
        end_line:
          $ref: '#/components/schemas/SafeUInt'
          minimum: 1
        end_column:
          $ref: '#/components/schemas/SafeUInt'
          minimum: 1
    ConfigValidationMode:
      type: string
      enum:
        - syntax
        - full
    ConfigValidationSource:
      type: object
      additionalProperties: false
      required:
        - content
      properties:
        id:
          type: string
          minLength: 1
          description: Request-local diagnostic ID. If omitted, use source-N where N is the one-based array index; all effective IDs must be unique. Never put secrets in IDs.
        path:
          type: string
          minLength: 1
          description: Optional engine-native source name and include-resolution base within the adapter's authorized local roots; never grants arbitrary file access.
        content:
          type: string
          description: Candidate engine-native source text; empty text is a candidate, not a malformed request.
    ConfigValidationRequest:
      type: object
      additionalProperties: false
      required:
        - sources
        - mode
      properties:
        sources:
          type: array
          minItems: 1
          description: Ordered candidate sources; the first is the main source. Supplied content takes precedence over local files at the same resolved path.
          items:
            $ref: '#/components/schemas/ConfigValidationSource'
        mode:
          $ref: '#/components/schemas/ConfigValidationMode'
    ConfigValidationResult:
      type: object
      required:
        - valid
        - diagnostics
        - generation_id
        - validated_at
      properties:
        valid:
          type: boolean
          description: True exactly when validation completed without error diagnostics; warnings and info do not invalidate the candidate. No promise that a later apply will succeed.
        diagnostics:
          type: array
          description: Source IDs identify submitted sources. Attribute a dependency failure to the referring submitted source and its include/subscription location, not an undisclosed local path.
          items:
            $ref: '#/components/schemas/ConfigDiagnostic'
        generation_id:
          type: string
          minLength: 1
          description: Running generation captured when validation starts, for context only; not a new candidate generation or an apply precondition.
        validated_at:
          $ref: '#/components/schemas/Timestamp'
          description: Time validation completed.
      if:
        properties:
          valid:
            const: true
      then:
        properties:
          diagnostics:
            not:
              contains:
                properties:
                  level:
                    const: error
                required:
                  - level
      else:
        properties:
          diagnostics:
            contains:
              properties:
                level:
                  const: error
              required:
                - level
