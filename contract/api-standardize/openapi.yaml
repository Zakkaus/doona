                      runtime_outbounds:
                        available: true
                      traffic_history:
                        available: true
                        max_window_seconds: 3600
                        max_points: 360
                      memory_history:
                        available: true
                        max_window_seconds: 3600
                        max_points: 720
                      runtime_mode:
                        available: true
                        modes:
                          - rule
                          - direct
                          - global
                      datapath:
                        available: true
                        kinds:
                          - ebpf
                        details:
                          - attachments
                          - maps
                      nodes:
                        available: true
                      providers:
                        available: true
                        can_refresh: true
                        max_page_size: 1000
                      groups:
                        available: true
                        config_patch: true
                        selection: true
                        max_patch_operations: 32
                      probes:
                        available: true
                        targets:
                          - node
                          - group
                        kinds:
                          - tcp_connect
                          - http
                          - dns
                        purposes:
                          - data
                          - dns
                        transports:
                          - tcp
                          - udp
                        ip_versions:
