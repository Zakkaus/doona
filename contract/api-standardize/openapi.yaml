                - download_bytes_per_second
              properties:
                window_seconds:
                  type: number
                  exclusiveMinimum: 0
                  description: Duration of the rate interval ending at sampled_at, in seconds.
                upload_bytes_per_second:
                  $ref: '#/components/schemas/NullableUInt64'
