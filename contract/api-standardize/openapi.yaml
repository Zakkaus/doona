    patch:
      operationId: patchRuntimeSettings
      summary: Change runtime-adjustable settings without a reload
      description: |
        Requires control and resources.runtime_settings.available; only the fields
        listed in resources.runtime_settings.fields may appear, others return 400
        invalid_request. The body is a merge: an absent field keeps its value. Every
        value is checked against its ceiling before anything changes; an unadvertised
        log level, a ring below 64 records, or a value above the ceiling returns 400
        and changes nothing. Shrinking a ring drops its oldest records and expires
        cursors older than the new floor. The change applies immediately and lasts
        until the process restarts or the next configuration activation resets it; it
        is not written to the configuration file.

        geodata is the exception. It requires resources.geodata.configurable_sources
        and an authenticated caller; the anonymous loopback principal gets 403
        permission_denied. The backend stores it and does not change the top-level
        source. A geodata patch merges into the stored settings. Patching geosite or
        geoip stores both URL lists (geodata.source becomes db); auto_update is
        stored on its own; null deletes everything stored. It never downloads; POST
        /geodata/update does. The stored settings are the only ones in force. At
        startup, the backend writes each geodata download URL the configuration file
        names into the stored settings, replacing a list a patch stored, and deletes
        a stored list that an earlier file wrote but the file no longer names.
        Activations never change them, so patched URLs last until the next startup.
        download follows the same startup rule as the URLs, and a download with
        route group whose group_id is not a current group returns 422
        unsupported_value and changes nothing.
      x-permission: control
      security:
        - bearerAuth: []
        - {}
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RuntimeSettingsPatch'
            examples:
              debug:
                value:
                  log:
                    level: debug
                  dns_log:
                    max_records: 1024
              geodata_sources:
                summary: Use a mirror first
                value:
                  geodata:
                    geosite:
                      urls:
                        - https://fastly.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geosite.dat
                        - https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/release/geosite.dat
                    geoip:
                      urls:
                        - https://fastly.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geoip.dat
                        - https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/release/geoip.dat
              geodata_auto_update:
                summary: Update every two days
                value:
                  geodata:
                    auto_update:
                      enabled: true
                      interval_hours: 48
              geodata_download:
                summary: Download geodata through a group
                value:
                  geodata:
                    download:
                      route: group
                      group_id: group-proxy
              geodata_reset:
                summary: Return to the built-in sources
                value:
                  geodata: null
      responses:
        '200':
          description: Settings after the change
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            X-Content-Type-Options:
              $ref: '#/components/headers/NoSniff'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuntimeSettings'
              examples:
                changed:
                  value:
                    observed_at: '2026-08-15T10:00:05Z'
                    source: runtime
                    log:
                      level: debug
                      buffered_records: 4096
                    dns_log:
                      max_records: 1024
                    flows:
                      max_flows: 10000
                      retention_seconds: 300
                  x-headers:
                    Content-Type: application/json
                    Cache-Control: no-store
                    X-Content-Type-Options: nosniff
                geodata_stored:
                  value:
                    observed_at: '2026-08-15T10:00:05Z'
                    source: config
                    log:
                      level: info
                      buffered_records: 4096
                    dns_log:
                      max_records: 2048
                    flows:
                      max_flows: 10000
                      retention_seconds: 300
                    geodata:
                      source: db
                      geosite:
                        urls:
                          - https://fastly.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geosite.dat
                          - https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/release/geosite.dat
                      geoip:
                        urls:
                          - https://fastly.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geoip.dat
                          - https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/release/geoip.dat
                      auto_update:
                        enabled: true
                        interval_hours: 24
                      download:
                        route: routing
                        group_id: null
                  x-headers:
                    Content-Type: application/json
                    Cache-Control: no-store
                    X-Content-Type-Options: nosniff
        '400':
          description: A field outside resources.runtime_settings.fields, an unadvertised level, or a value outside its range
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
