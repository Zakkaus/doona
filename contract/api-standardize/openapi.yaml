        '404':
          $ref: '#/components/responses/NotFound'
    put:
      operationId: setRuntimeMode
      summary: Switch the outbound mode without a reload
      description: |
        Requires control and resources.runtime_mode.available; mode must be one
        of resources.runtime_mode.modes. global needs target, the id of a group
        or node every flow then leaves through; rule and direct take no target.
        Presets the engine treats as must (LAN, multicast, the network manager)
        keep applying in every mode. The change applies immediately, interrupts
        nothing already established, and is dropped by the next activation.
        Follows the shared idempotency rules.
      x-permission: control
      security:
        - bearerAuth: []
        - {}
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RuntimeModeRequest'
            examples:
              global:
                value:
                  mode: global
                  target: group-proxy
      responses:
        '200':
          description: Mode after the change
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            X-Content-Type-Options:
              $ref: '#/components/headers/NoSniff'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuntimeMode'
              examples:
                global:
                  value:
                    observed_at: '2026-08-15T10:00:05Z'
                    mode: global
                    target: group-proxy
                    source: runtime
                  x-headers:
                    Content-Type: application/json
                    Cache-Control: no-store
