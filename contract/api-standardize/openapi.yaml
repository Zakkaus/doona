              $ref: '#/components/headers/NoStore'
            X-Content-Type-Options:
              $ref: '#/components/headers/NoSniff'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Capabilities'
              examples:
                available:
                  value:
                    observed_at: '2026-08-15T10:00:00Z'
                    profiles:
                      - base
                    limits:
                      max_request_target_bytes: 4096
                      max_header_bytes: 16384
                      max_json_body_bytes: 65536
                    resources:
                      config:
                        available: true
                        content: false
                        writable: true
                        max_bytes: 65536
                        max_sources: 32
                      config_validate:
                        available: true
                        modes:
                          - syntax
                          - full
                        max_bytes: 65536
                        max_sources: 32
                      runtime:
                        available: true
                      runtime_memory:
                        available: true
                        metrics:
                          - process.rss_bytes
                          - cgroup.current_bytes
                          - cgroup.limit_bytes
                          - cgroup.events.high
                          - cgroup.events.oom
