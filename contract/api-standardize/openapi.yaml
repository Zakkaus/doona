            - string
            - 'null'
        recovery_penalty_ms:
          type:
            - number
            - 'null'
        group_offset_ms:
          type:
            - number
            - 'null'
        score:
          type:
            - number
            - 'null'
        reason:
          type:
            - string
            - 'null'
    GroupHealthObservation:
      allOf:
        - $ref: '#/components/schemas/HealthObservation'
        - type: object
          required:
            - member_id
            - sorting_latency_ms
            - ranking
          properties:
            member_id:
              type: string
              minLength: 1
            resolved_leaf_node_id:
              type:
                - string
                - 'null'
            sorting_latency_ms:
              type:
                - number
                - 'null'
            ranking:
              oneOf:
                - type: 'null'
                - $ref: '#/components/schemas/GroupRanking'
    GroupRuntime:
      type: object
      required:
        - selection
        - health
      properties:
        selection:
          type: object
          required:
            - tcp
            - udp
          properties:
            tcp:
              oneOf:
                - type: 'null'
                - $ref: '#/components/schemas/GroupSelection'
            udp:
              oneOf:
                - type: 'null'
                - $ref: '#/components/schemas/GroupSelection'
        health:
          type: array
          items:
            $ref: '#/components/schemas/GroupHealthObservation'
    GroupCapabilities:
      type: object
      required:
        - can_select
        - can_override
        - supports_nested_groups
        - mutable_config
        - probe_transports
      properties:
        can_select:
          type: boolean
          description: The policy is a manual selector; PUT selection replaces its choice.
        can_override:
          type: boolean
          description: The policy chooses automatically but accepts a pinned member; PUT selection pins, DELETE selection returns to automatic.
        supports_nested_groups:
          type: boolean
        mutable_config:
          type: array
          uniqueItems: true
          items:
            type: string
            enum:
