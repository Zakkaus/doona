          - $ref: '#/components/schemas/OutboundPatch'
          - $ref: '#/components/schemas/CheckUrlPatch'
          - $ref: '#/components/schemas/PositiveIntegerPatch'
          - $ref: '#/components/schemas/TolerancePatch'
          - $ref: '#/components/schemas/IdleTimeoutPatch'
          - $ref: '#/components/schemas/InterruptPatch'
