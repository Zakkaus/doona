            - data
          properties:
            stage:
              const: outbound
            data:
              $ref: '#/components/schemas/OutboundStepData'
    OutboundStepData:
      type: object
      required:
        - attempt_id
        - parent_attempt_id
        - kind
        - evaluation_id
        - routing_source
        - routed_outbound
        - effective_outbound
        - mode_override
        - selection_path
        - leaf_node_id
        - leaf_node_name
        - target
        - target_kind
        - dial_ip
        - server_addr
        - resolution_location
        - status
        - error
      properties:
        attempt_id:
          type: string
          minLength: 1
        parent_attempt_id:
          type:
            - string
            - 'null'
        kind:
          type: string
          enum:
            - leaf
            - transport
        evaluation_id:
          type:
            - string
            - 'null'
          minLength: 1
        routing_source:
          type: string
          enum:
            - evaluation
            - forced
            - builtin
            - unknown
        routed_outbound:
          type:
            - string
            - 'null'
        effective_outbound:
          type:
            - string
            - 'null'
        mode_override:
          type: string
          enum:
            - none
            - direct
            - global
            - unknown
          description: Clash-mode override observed for this outbound attempt, separate from the configured dial mode. This field does not expose a native runtime-mode setting. none means no override was applied; unknown means the recorder could not determine it.
        selection_path:
          type: array
          items:
            $ref: '#/components/schemas/SelectionPathItem'
        leaf_node_id:
          type:
            - string
            - 'null'
        leaf_node_name:
          type:
            - string
            - 'null'
          description: Sanitized leaf name captured at decision time, or null when unavailable; leaf_node_id remains authoritative.
        target:
          type:
            - string
            - 'null'
        target_kind:
          type: string
          enum:
            - ip
            - domain
            - none
            - unknown
        dial_ip:
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/IpAddress'
        server_addr:
          type:
            - string
            - 'null'
        resolution_location:
          type: string
          enum:
            - original_ip
            - local_dns
            - outbound_remote
            - not_applicable
            - unknown
        status:
          type: string
          enum:
            - started
            - succeeded
            - failed
            - cancelled
        error:
          type:
            - string
            - 'null'
      if:
        properties:
          routing_source:
            const: evaluation
      then:
        properties:
          evaluation_id:
            type: string
      else:
        properties:
          evaluation_id:
            type: 'null'
    SelectionPathItem:
      type: object
      required:
        - group_id
        - member_id
        - member_name
        - policy
        - reason
        - selection
      properties:
        group_id:
          type: string
          minLength: 1
        member_id:
          type:
            - string
            - 'null'
          minLength: 1
        member_name:
          type:
            - string
            - 'null'
          description: Sanitized member name captured at decision time, or null when unavailable; member_id remains authoritative.
        policy:
          type: string
          minLength: 1
        reason:
          type: string
          minLength: 1
        selection:
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/SelectionDecision'
    SelectionDecision:
      type: object
      required:
        - previous_member_id
        - metric
        - tolerance_ms
        - candidates
      properties:
        previous_member_id:
          type:
            - string
            - 'null'
        metric:
          type:
            - string
            - 'null'
        tolerance_ms:
          type:
            - number
            - 'null'
        candidates:
          type: array
          items:
            $ref: '#/components/schemas/SelectionCandidate'
    SelectionCandidate:
      type: object
      required:
        - member_id
        - member_name
        - leaf_node_id
        - leaf_node_name
        - eligible
        - sorting_latency_ms
        - score
        - selected
        - reason
      properties:
        member_id:
          type: string
          minLength: 1
        member_name:
          type:
            - string
            - 'null'
          description: Sanitized member name captured at decision time, or null when unavailable; member_id remains authoritative.
        leaf_node_id:
          type:
            - string
            - 'null'
        leaf_node_name:
          type:
            - string
            - 'null'
          description: Sanitized leaf name captured at decision time, or null when unavailable; leaf_node_id remains authoritative.
        eligible:
          type:
            - boolean
            - 'null'
        sorting_latency_ms:
          type:
            - number
            - 'null'
        score:
          type:
            - number
            - 'null'
        selected:
          type: boolean
        reason:
          type: string
          minLength: 1
    ConnectionStep:
      allOf:
        - $ref: '#/components/schemas/StepCommon'
        - type: object
          required:
            - stage
            - data
          properties:
            stage:
              const: connection
            data:
              $ref: '#/components/schemas/ConnectionStepData'
    ConnectionStepData:
      type: object
      required:
        - state
        - reason
        - milestone
        - attempt_id
        - reply_received
        - error
      properties:
        state:
          $ref: '#/components/schemas/ConnectionState'
        reason:
          type: string
          minLength: 1
        milestone:
          type: string
          enum:
            - transport_ready
            - target_request_sent
            - target_confirmed
            - first_reply
            - terminal
            - unknown
        attempt_id:
          type:
            - string
            - 'null'
        reply_received:
          type:
            - boolean
            - 'null'
        error:
          type:
            - string
            - 'null'
    RuleResult:
      type: string
      enum:
        - matched
        - not_matched
        - skipped
        - indeterminate
    RuleCondition:
      type: object
      required:
        - id
        - expression
        - result
        - missing_inputs
      properties:
        id:
          type: string
          minLength: 1
        expression:
          type:
            - string
            - 'null'
        result:
          $ref: '#/components/schemas/RuleResult'
        missing_inputs:
          type: array
          uniqueItems: true
          items:
            type: string
            minLength: 1
    RuleEvaluation:
      type: object
      required:
        - rule_id
        - expression
        - result
        - missing_inputs
        - conditions
      properties:
        rule_id:
          type: string
          minLength: 1
        expression:
          type:
            - string
            - 'null'
        result:
          $ref: '#/components/schemas/RuleResult'
        missing_inputs:
          type: array
          uniqueItems: true
          items:
            type: string
            minLength: 1
        conditions:
          type: array
          items:
            $ref: '#/components/schemas/RuleCondition'
    IpAddress:
      oneOf:
        - type: string
          format: ipv4
        - type: string
          format: ipv6
    RoutingTraceInput:
      type: object
      additionalProperties: false
      required:
        - network
        - dst_port
      properties:
        network:
          $ref: '#/components/schemas/Transport'
        domain:
          type:
            - string
            - 'null'
          minLength: 1
        dst_ip:
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/IpAddress'
        dst_port:
          type: integer
          minimum: 1
          maximum: 65535
        src_ip:
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/IpAddress'
        src_port:
          type:
            - integer
            - 'null'
          minimum: 1
          maximum: 65535
        pname:
          type:
            - string
            - 'null'
        dscp:
          type:
            - integer
            - 'null'
          minimum: 0
          maximum: 63
        mark:
          type:
            - integer
            - 'null'
          minimum: 0
          maximum: 4294967295
      anyOf:
        - required:
            - domain
          properties:
            domain:
              type: string
              minLength: 1
        - required:
            - dst_ip
          properties:
            dst_ip:
              $ref: '#/components/schemas/IpAddress'
    RoutingTraceRequest:
      type: object
      additionalProperties: false
      required:
        - input
      properties:
        input:
          $ref: '#/components/schemas/RoutingTraceInput'
        resolve:
          type: string
          enum:
            - none
            - live
          default: none
      allOf:
        - if:
            required:
              - resolve
            properties:
              resolve:
                const: live
          then:
            properties:
              input:
                allOf:
                  - required:
                      - domain
                    properties:
                      domain:
                        type: string
                        minLength: 1
                  - properties:
                      dst_ip:
                        type: 'null'
    RoutingEvaluation:
      type: object
      required:
        - dst_ip
        - decision
        - outbound
        - missing_inputs
        - rules
      properties:
        dst_ip:
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/IpAddress'
        decision:
          type: string
          enum:
            - determinate
            - indeterminate
        outbound:
          type:
            - string
            - 'null'
        missing_inputs:
          type: array
          uniqueItems: true
          items:
            type: string
            minLength: 1
        rules:
          type: array
          items:
            $ref: '#/components/schemas/RuleEvaluation'
    SimulationDnsData:
      allOf:
        - $ref: '#/components/schemas/DnsStepData'
        - type: object
          properties:
            lookup_id:
              type: string
              minLength: 1
              description: Simulation-local lookup ID; never a recorded-flow identity.
            purpose:
              const: dial_target
            attempt_id:
              type: 'null'
              description: Simulations never create outbound attempts.
    RoutingTraceResponse:
      type: object
      required:
        - mode
        - instance_id
        - generation_id
        - observed_at
        - evaluations
        - dns
      properties:
        mode:
          type: string
          const: simulation
        instance_id:
          type: string
          minLength: 1
        generation_id:
          type: string
          minLength: 1
        observed_at:
          $ref: '#/components/schemas/Timestamp'
        evaluations:
          type: array
          items:
            $ref: '#/components/schemas/RoutingEvaluation'
        dns:
          type: array
          items:
            $ref: '#/components/schemas/SimulationDnsData'
      not:
        anyOf:
          - required:
              - id
          - required:
              - flow_id
          - required:
              - connection_id
      description: Hypothetical output. It never identifies or claims history for a live flow.
    RuleSource:
      oneOf:
        - type: 'null'
        - type: object
          required:
            - file
            - source_id
            - line
            - column
          properties:
            file:
              type: string
              minLength: 1
              description: Redacted source label; never an absolute local path or credential-bearing URL.
            source_id:
              type: string
              minLength: 1
              description: |
                Source ID from GET /config. Open the source by ID under the configuration
                visibility rules; never derive a path from file.
            line:
              $ref: '#/components/schemas/SafeUInt'
              minimum: 1
            column:
              $ref: '#/components/schemas/NullableSafeUInt'
              minimum: 1
              description: One-based UTF-8 byte column of the rule's first token, or null if unknown.
      description: Source location, or null when unavailable or unsafe to disclose. Coordinates refer to the original source before redaction.
    RoutingRule:
      type: object
      required:
        - rule_id
        - index
        - expression
        - outbound
        - must
        - source
        - kind
      properties:
        rule_id:
          type: string
          minLength: 1
          description: Identical to POST /routing/trace rule IDs and FlowSummary.rule_id within the same generation; opaque to clients.
        index:
          $ref: '#/components/schemas/SafeUInt'
          description: Zero-based evaluation order within this generation, not a cross-generation identity.
        expression:
          type: string
          minLength: 1
          description: Safe display expression, not raw configuration or an editable source representation.
        outbound:
          type: string
          minLength: 1
          description: Rule outbound, not a resolved leaf node or a claim of a successful dial.
        must:
          type: boolean
        source:
          $ref: '#/components/schemas/RuleSource'
        kind:
          type: string
          enum:
            - rule
            - fallback
    RuleFallback:
      type: object
      required:
        - outbound
        - source
      properties:
        outbound:
          type: string
          minLength: 1
        source:
          $ref: '#/components/schemas/RuleSource'
      description: Same outbound and source as the fallback entry in rules; the entry carries its rule_id.
    RuleList:
      type: object
      required:
        - generation_id
        - rules
        - fallback
      properties:
        generation_id:
          type: string
          minLength: 1
        rules:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/RoutingRule'
          contains:
            type: object
            required:
              - kind
            properties:
              kind:
                const: fallback
          minContains: 1
          maxContains: 1
          description: Complete evaluation order with unique rule_id and index values, including exactly one final fallback entry.
        fallback:
          $ref: '#/components/schemas/RuleFallback'
    DnsRecordType:
      type: string
      pattern: ^(?:[A-Z][A-Z0-9-]*|TYPE[0-9]{1,5}|[0-9]{1,5})$
    DnsAnswer:
      type: object
      required:
        - name
        - type
        - class
        - ttl
        - data
      properties:
        name:
          type: string
          minLength: 1
        type:
          $ref: '#/components/schemas/DnsRecordType'
        class:
          type: string
          minLength: 1
        ttl:
          type: integer
          minimum: 0
          maximum: 4294967295
        data:
          type: string
    DnsQuestion:
      type: object
      required:
        - name
        - type
      properties:
        name:
          type: string
          minLength: 1
        type:
          $ref: '#/components/schemas/DnsRecordType'
    DnsRoute:
      type: object
      required:
        - source
        - rule
      properties:
        source:
          type: string
          enum:
            - forced
            - dns.routing
            - default
        rule:
          type:
            - string
            - 'null'
    DnsQueryResult:
      type: object
      required:
        - type
        - cached
        - cache_entry_id
        - upstream
        - route
        - status
        - elapsed_ms
        - question
      properties:
        type:
          $ref: '#/components/schemas/DnsRecordType'
        cached:
          type: boolean
        cache_entry_id:
          type:
            - string
            - 'null'
        upstream:
          type:
            - string
            - 'null'
        route:
          $ref: '#/components/schemas/DnsRoute'
        status:
          type: string
          minLength: 1
        elapsed_ms:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        question:
          $ref: '#/components/schemas/DnsQuestion'
        answers:
          type: array
          items:
            $ref: '#/components/schemas/DnsAnswer'
    DnsQueryResponse:
      type: object
      required:
        - domain
        - cache_mode
        - query_time
        - results
      properties:
        domain:
          type: string
          minLength: 1
        cache_mode:
          type: string
          enum:
            - normal
            - bypass
        query_time:
          $ref: '#/components/schemas/Timestamp'
        results:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/DnsQueryResult'
    DnsCacheCoverage:
      type: object
      required:
        - positive
        - negative
        - persistent
      properties:
        positive:
          type: boolean
        negative:
          type: boolean
        persistent:
          type: boolean
    DnsCacheEntry:
      type: object
      required:
        - entry_id
        - domain
        - type
        - class
        - status
        - expires_at
        - stale_until
      properties:
        entry_id:
          type: string
          minLength: 1
        domain:
          type: string
          minLength: 1
          pattern: \.$
        type:
          $ref: '#/components/schemas/DnsRecordType'
        class:
          type: string
          minLength: 1
        status:
          type: string
          minLength: 1
        answers:
          type: array
          items:
            $ref: '#/components/schemas/DnsAnswer'
        expires_at:
          $ref: '#/components/schemas/Timestamp'
        stale_until:
          $ref: '#/components/schemas/NullableTimestamp'
    DnsCacheList:
      type: object
      required:
        - observed_at
        - coverage
        - entries
        - total
        - next_cursor
      properties:
        observed_at:
          $ref: '#/components/schemas/Timestamp'
        coverage:
          $ref: '#/components/schemas/DnsCacheCoverage'
        entries:
          type: array
          items:
            $ref: '#/components/schemas/DnsCacheEntry'
        total:
          $ref: '#/components/schemas/SafeUInt'
        next_cursor:
          type:
            - string
            - 'null'
        usage:
          $ref: '#/components/schemas/DnsCacheUsage'
          description: Absent from servers that predate cache usage reporting.
    DnsCacheUsage:
      type: object
      description: Whole runtime cache at snapshot time, independent of the listing filters. Every page of one snapshot repeats the same values. The entry count is the cache's only limit; the size of an entry is not bounded.
      required:
        - entries
        - entry_capacity
      properties:
        entries:
          $ref: '#/components/schemas/UInt64'
        entry_capacity:
          $ref: '#/components/schemas/UInt64'
          description: Effective entry limit after the engine applies its bounds, at most 100,000.
    DnsLogRecord:
      type: object
      required:
        - id
        - observed_at
        - src
        - question
        - status
        - cached
        - upstream
        - route
        - elapsed_ms
        - answers
      properties:
        id:
          type: string
          minLength: 1
          description: Opaque, unique within the running instance; the cursor is derived from it.
        observed_at:
          $ref: '#/components/schemas/Timestamp'
        src:
          type:
            - string
            - 'null'
          description: Client socket address, IPv6 in brackets; null when the resolver itself asked.
        question:
          $ref: '#/components/schemas/DnsQuestion'
        status:
          type: string
          minLength: 1
          description: RCODE name such as NOERROR or NXDOMAIN, or an engine outcome such as TIMEOUT.
        cached:
          type: boolean
        upstream:
          type:
            - string
            - 'null'
          description: The upstream that answered, null on a cache hit or failure before sending.
        route:
          $ref: '#/components/schemas/DnsRoute'
        elapsed_ms:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        answers:
          type: array
          items:
            $ref: '#/components/schemas/DnsAnswer'
    DnsLogList:
      type: object
      required:
        - observed_at
        - total
        - next_cursor
        - records
      properties:
        observed_at:
          $ref: '#/components/schemas/Timestamp'
        total:
          $ref: '#/components/schemas/SafeUInt'
          description: Records in the ring at observed_at, before filters.
        next_cursor:
          type:
            - string
            - 'null'
        records:
          type: array
          items:
            $ref: '#/components/schemas/DnsLogRecord'
    DeleteCount:
      type: object
      required:
        - deleted
      properties:
        deleted:
          type: integer
          minimum: 0
    DeleteMatchingCount:
      type: object
      required:
        - matched
        - deleted
      properties:
        matched:
          type: integer
          minimum: 0
        deleted:
          type: integer
          minimum: 0
    OperationKind:
      type: string
      enum:
        - probe
        - reload
        - suspend
        - resume
        - group_update
        - provider_refresh
        - geodata_update
    OperationAccepted:
      type: object
      required:
        - operation_id
        - kind
        - status
        - href
      properties:
        operation_id:
          type: string
          minLength: 1
        kind:
          $ref: '#/components/schemas/OperationKind'
        status:
          type: string
          const: queued
        href:
          type: string
          pattern: ^/api/v1/operations/[^/]+$
    Operation:
      oneOf:
        - $ref: '#/components/schemas/QueuedOperation'
        - $ref: '#/components/schemas/RunningOperation'
        - $ref: '#/components/schemas/FailedOperation'
        - $ref: '#/components/schemas/ProbeSucceededOperation'
        - $ref: '#/components/schemas/ReloadSucceededOperation'
        - $ref: '#/components/schemas/SuspendSucceededOperation'
        - $ref: '#/components/schemas/ResumeSucceededOperation'
        - $ref: '#/components/schemas/GroupUpdateSucceededOperation'
        - $ref: '#/components/schemas/ProviderRefreshSucceededOperation'
        - $ref: '#/components/schemas/GeoDataUpdateSucceededOperation'
    QueuedOperation:
      allOf:
        - $ref: '#/components/schemas/OperationCommon'
        - type: object
          properties:
            status:
              const: queued
            started_at:
              type: 'null'
            finished_at:
              type: 'null'
            result:
              type: 'null'
            error:
              type: 'null'
    RunningOperation:
      allOf:
        - $ref: '#/components/schemas/OperationCommon'
        - type: object
          properties:
            status:
              const: running
            finished_at:
              type: 'null'
            result:
              type: 'null'
            error:
              type: 'null'
    FailedOperation:
      allOf:
        - $ref: '#/components/schemas/OperationCommon'
        - type: object
          properties:
            status:
              const: failed
            finished_at:
              $ref: '#/components/schemas/Timestamp'
            result:
              type: 'null'
            error:
              $ref: '#/components/schemas/SafeError'
    ProbeSucceededOperation:
      allOf:
        - $ref: '#/components/schemas/OperationCommon'
        - type: object
          properties:
            kind:
              const: probe
            status:
              const: succeeded
            finished_at:
              $ref: '#/components/schemas/Timestamp'
            result:
              $ref: '#/components/schemas/ProbeResult'
            error:
              type: 'null'
    ReloadSucceededOperation:
      allOf:
        - $ref: '#/components/schemas/OperationCommon'
        - type: object
          properties:
            kind:
              const: reload
            status:
              const: succeeded
            finished_at:
              $ref: '#/components/schemas/Timestamp'
            result:
              $ref: '#/components/schemas/ReloadResult'
            error:
              type: 'null'
    ReloadResult:
      type: object
      required:
        - active_generation_id
        - datapath_generation_id
      properties:
        active_generation_id:
          type:
            - string
            - 'null'
        datapath_generation_id:
          type:
            - string
            - 'null'
    SuspendSucceededOperation:
      allOf:
        - $ref: '#/components/schemas/OperationCommon'
        - type: object
          properties:
            kind:
              const: suspend
            status:
              const: succeeded
            finished_at:
              $ref: '#/components/schemas/Timestamp'
            result:
              type: object
              required:
                - runtime_state
              properties:
                runtime_state:
                  type:
                    - string
                    - 'null'
                  enum:
                    - suspended
                    - null
            error:
              type: 'null'
    ResumeSucceededOperation:
      allOf:
        - $ref: '#/components/schemas/OperationCommon'
        - type: object
          properties:
            kind:
              const: resume
            status:
              const: succeeded
            finished_at:
              $ref: '#/components/schemas/Timestamp'
            result:
              type: object
              required:
                - runtime_state
              properties:
                runtime_state:
                  type:
                    - string
                    - 'null'
                  enum:
                    - running
                    - null
            error:
              type: 'null'
    GroupUpdateSucceededOperation:
      allOf:
        - $ref: '#/components/schemas/OperationCommon'
        - type: object
          properties:
            kind:
              const: group_update
            status:
              const: succeeded
            finished_at:
              $ref: '#/components/schemas/Timestamp'
            result:
              $ref: '#/components/schemas/GroupUpdateResult'
            error:
              type: 'null'
    GroupUpdateResult:
      type: object
      required:
        - group_id
        - config_revision
      properties:
        group_id:
          type: string
          minLength: 1
        config_revision:
          type: string
          minLength: 1
    EventKind:
      type: string
      enum:
        - stream.ready
        - runtime.updated
        - flow.updated
        - flow.gap
        - operation.updated
        - generation.changed
    LogLevel:
      type: string
      enum:
        - trace
        - debug
        - info
        - warn
        - error
    LogRecord:
      type: object
      required:
        - ts
        - level
        - target
        - message
        - fields
      properties:
        ts:
          $ref: '#/components/schemas/Timestamp'
        level:
          $ref: '#/components/schemas/LogLevel'
        target:
          type: string
          minLength: 1
          description: Engine module name, not a network destination.
        message:
          type: string
          minLength: 1
          description: Sanitized operator message; no secrets or raw configuration.
        fields:
          type:
            - object
            - 'null'
          additionalProperties: true
          description: Sanitized structured fields, or null when unavailable; the message safety rules apply recursively.
    RuntimeSettingField:
      type: string
      enum:
        - log.level
        - log.buffered_records
        - dns_log.max_records
        - flows.max_flows
        - flows.retention_seconds
        - record_flows
        - record_logs
        - record_dns_log
        - geodata
    RuntimeSettings:
      type: object
      required:
        - observed_at
        - source
        - log
        - dns_log
        - flows
      properties:
        observed_at:
          $ref: '#/components/schemas/Timestamp'
        source:
          type: string
          enum:
            - config
            - runtime
          description: config while every value comes from the activated configuration; runtime once any PATCH overrode one. geodata has its own source and does not affect this one.
        log:
          type: object
          required:
            - level
            - buffered_records
          properties:
            level:
              $ref: '#/components/schemas/LogLevel'
              description: Minimum severity the engine emits. A lower stream level cannot recover records the engine did not emit.
            buffered_records:
              $ref: '#/components/schemas/SafeUInt'
              minimum: 64
              description: Log replay ring capacity, at most logs.max_buffered_records.
        dns_log:
          type: object
          required:
            - max_records
          properties:
            max_records:
              $ref: '#/components/schemas/SafeUInt'
              minimum: 64
              description: DNS log ring capacity, at most dns_log.max_records.
        flows:
          type: object
          required:
            - max_flows
            - retention_seconds
          properties:
            max_flows:
              $ref: '#/components/schemas/SafeUInt'
              minimum: 64
              description: Retained flows, at most flows.max_flows.
            retention_seconds:
              $ref: '#/components/schemas/SafeUInt'
              minimum: 1
              description: Maximum age of a retained terminal flow, in seconds, bounded by resources.flows.retention_seconds. Capacity pressure may evict it earlier.
        recording:
          type: object
          required:
            - flows
            - logs
            - dns_log
            - events
            - grace_remaining_seconds
          description: |
            Read-only recorder state. A client is attached while an admitted GET SSE stream on
            /events or /logs is open, or for 60 seconds after the last stream closed or a successful
            GET on /flows, /flows/{id} or /dns/log; other requests, including settings reads, do not
            renew attachment. Automatic log and DNS-log recorders follow attachment. The automatic
            flow recorder follows flow demand instead, so that an open panel does not record full
            flow traces for every connection: an admitted GET /events stream whose kinds include
            flow.updated or flow.gap, or that sets a nonblank flow_id with a flow kind in its
            effective kinds, holds demand while open and for 60 seconds after the last one closed,
            and a successful GET on /flows or /flows/{id} renews it for 60 seconds. Event streams
            without kinds, /logs streams and /dns/log reads do not create flow demand. Recording
            starts on attachment or demand, so the first history a client reads may be empty.
          properties:
            flows:
              $ref: '#/components/schemas/RecorderState'
            logs:
              $ref: '#/components/schemas/RecorderState'
            dns_log:
              $ref: '#/components/schemas/RecorderState'
            events:
              type: object
              required:
                - active
              properties:
                active:
                  type: boolean
                  description: Event capture runs while a client is attached or any permitted recorder is pinned on.
            grace_remaining_seconds:
              $ref: '#/components/schemas/SafeUInt'
              description: Seconds left before the automatic log and DNS-log recorders stop, 0 while a stream is open or nothing is attached. The flow-demand grace is not reported.
        geodata:
          $ref: '#/components/schemas/GeoDataSettings'
          description: Geodata download sources and automatic updates. Present when resources.geodata.configurable_sources is true. URLs are returned as written only to an authenticated caller with control and redacted for everyone else.
    RuntimeSettingsPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        record_flows:
          $ref: '#/components/schemas/RecorderMode'
        record_logs:
          $ref: '#/components/schemas/RecorderMode'
        record_dns_log:
          $ref: '#/components/schemas/RecorderMode'
        log:
          type: object
          additionalProperties: false
          minProperties: 1
          properties:
            level:
              $ref: '#/components/schemas/LogLevel'
            buffered_records:
              $ref: '#/components/schemas/SafeUInt'
              minimum: 64
        dns_log:
          type: object
          additionalProperties: false
          minProperties: 1
          properties:
            max_records:
              $ref: '#/components/schemas/SafeUInt'
              minimum: 64
        flows:
          type: object
          additionalProperties: false
          minProperties: 1
          properties:
            max_flows:
              $ref: '#/components/schemas/SafeUInt'
              minimum: 64
            retention_seconds:
              $ref: '#/components/schemas/SafeUInt'
              minimum: 1
        geodata:
          $ref: '#/components/schemas/GeoDataSettingsPatch'
    RecorderMode:
      description: true pins a permitted recorder on, false forces it off, auto (the startup default) follows flow demand for record_flows and client attachment for the other recorders.
      oneOf:
        - type: boolean
        - type: string
          enum:
            - auto
    RecorderState:
      type: object
      required:
        - allowed
        - mode
        - active
      properties:
        allowed:
          type: boolean
          description: The configuration permits this recorder; false means never, whatever the mode.
        mode:
          type: string
          enum:
            - auto
            - 'on'
            - 'off'
        active:
          type: boolean
          description: The recorder is capturing right now.
    StreamReadyEvent:
      type: object
      required:
        - instance_id
        - observed_at
      properties:
        instance_id:
          type: string
          minLength: 1
        observed_at:
          $ref: '#/components/schemas/Timestamp'
      not:
        anyOf:
          - required:
              - href
          - required:
              - resource_id
          - required:
              - revision
          - required:
              - status
          - required:
              - reason
          - required:
              - previous_generation_id
          - required:
              - generation_id
    RuntimeUpdatedEvent:
      type: object
      required:
        - instance_id
        - observed_at
        - href
      properties:
        instance_id:
          type: string
          minLength: 1
        observed_at:
          $ref: '#/components/schemas/Timestamp'
        href:
          const: /api/v1/runtime
    FlowUpdatedEvent:
      type: object
      required:
        - instance_id
        - observed_at
        - resource_id
        - revision
        - href
      properties:
        instance_id:
          type: string
          minLength: 1
        observed_at:
          $ref: '#/components/schemas/Timestamp'
        resource_id:
          type: string
          minLength: 1
        revision:
          type: integer
          minimum: 1
          maximum: 9007199254740991
        href:
          type: string
          pattern: ^/api/v1/flows/[^/]+$
    FlowGapEvent:
      type: object
      required:
        - instance_id
        - observed_at
        - resource_id
        - reason
        - dropped_records
      properties:
        instance_id:
          type: string
          minLength: 1
        observed_at:
          $ref: '#/components/schemas/Timestamp'
        resource_id:
          type:
            - string
            - 'null'
        reason:
          type: string
          enum:
            - buffer_overflow
            - sampled
            - evicted
            - recording_changed
        dropped_records:
          $ref: '#/components/schemas/NullableUInt64'
    OperationUpdatedEvent:
      type: object
      required:
        - instance_id
        - observed_at
        - resource_id
        - status
        - href
      properties:
        instance_id:
          type: string
          minLength: 1
        observed_at:
          $ref: '#/components/schemas/Timestamp'
        resource_id:
          type: string
          minLength: 1
        status:
          type: string
          enum:
            - queued
            - running
            - succeeded
            - failed
        href:
          type: string
          pattern: ^/api/v1/operations/[^/]+$
    GenerationChangedEvent:
      type: object
      required:
        - instance_id
        - observed_at
        - previous_generation_id
        - generation_id
      properties:
        instance_id:
          type: string
          minLength: 1
        observed_at:
          $ref: '#/components/schemas/Timestamp'
        previous_generation_id:
          type: string
          minLength: 1
        generation_id:
          type: string
          minLength: 1
    StepCommon:
      type: object
      required:
        - seq
        - observed_at
        - elapsed_us
        - generation_id
        - evidence
      properties:
        seq:
          type: integer
          minimum: 1
          maximum: 9007199254740991
        observed_at:
          $ref: '#/components/schemas/NullableTimestamp'
        elapsed_us:
          $ref: '#/components/schemas/NullableSafeUInt'
        generation_id:
          type:
            - string
            - 'null'
        evidence:
          type: string
          enum:
            - observed
            - reconstructed
    OperationCommon:
      type: object
      required:
        - operation_id
        - kind
        - status
        - created_at
        - started_at
        - finished_at
        - result
        - error
      properties:
        operation_id:
          type: string
          minLength: 1
        kind:
          $ref: '#/components/schemas/OperationKind'
        status:
          type: string
          enum:
            - queued
            - running
            - succeeded
            - failed
        created_at:
          $ref: '#/components/schemas/Timestamp'
        started_at:
          $ref: '#/components/schemas/NullableTimestamp'
        finished_at:
          $ref: '#/components/schemas/NullableTimestamp'
        result:
          type:
            - object
            - 'null'
          additionalProperties: true
        error:
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/SafeError'
    schema:
      allOf:
        - $ref: '#/components/schemas/ErrorResponse'
        - type: object
          properties:
            error:
              type: object
              required:
                - details
              properties:
                code:
                  const: unsupported_value
                details:
                  type: object
                  required:
                    - diagnostics
                  properties:
                    diagnostics:
                      type: array
                      items:
                        $ref: '#/components/schemas/ConfigDiagnostic'
                      contains:
                        type: object
                        required:
                          - level
                        properties:
                          level:
                            const: error
  examples:
    FlowUpdated:
      summary: Flow revision notification
      x-event: flow.updated
      x-event-id: instance-7:124
      value:
        instance_id: instance-7
        observed_at: '2026-09-14T10:00:00Z'
        resource_id: flow-23
        revision: 8
        href: /api/v1/flows/flow-23
