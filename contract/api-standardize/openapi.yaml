    GroupConfig:
      type: object
      required:
        - default_member_id
        - final_outbound
        - check_url
        - check_interval
        - tolerance
        - idle_timeout
        - interrupt_connections
      properties:
        default_member_id:
          type:
            - string
            - 'null'
        final_outbound:
          type:
            - string
            - 'null'
        check_url:
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/SafeHttpUrl'
        check_interval:
          type:
            - integer
            - 'null'
          minimum: 1
        tolerance:
          type:
            - number
            - 'null'
          minimum: 0
        idle_timeout:
          type:
            - integer
            - 'null'
          minimum: 0
        interrupt_connections:
          type: boolean
    SafeHttpUrl:
      type: string
      format: uri
      pattern: ^https?://(?![^/?#]*@)
      description: Absolute HTTP(S) URL without userinfo; server also enforces administrator SSRF policy.
    GroupSelection:
      type: object
      required:
        - member_id
        - source
      properties:
        member_id:
          type: string
          minLength: 1
        resolved_leaf_node_id:
          type:
            - string
            - 'null'
        source:
          type: string
          minLength: 1
          description: How the member was chosen. `override` while a pinned member stands in for an automatic policy; other values (health, runtime, policy, ...) are the engine's own.
    GroupRanking:
      type: object
      required:
        - metric
        - recovery_penalty_ms
        - group_offset_ms
        - score
        - reason
      properties:
        metric:
          type:
            - string
            - 'null'
        recovery_penalty_ms:
          type:
            - number
            - 'null'
        group_offset_ms:
          type:
            - number
            - 'null'
        score:
          type:
            - number
            - 'null'
        reason:
          type:
            - string
            - 'null'
    GroupHealthObservation:
      allOf:
        - $ref: '#/components/schemas/HealthObservation'
        - type: object
          required:
            - member_id
            - sorting_latency_ms
            - ranking
          properties:
            member_id:
              type: string
              minLength: 1
            resolved_leaf_node_id:
              type:
                - string
                - 'null'
            sorting_latency_ms:
              type:
                - number
                - 'null'
            ranking:
              oneOf:
                - type: 'null'
                - $ref: '#/components/schemas/GroupRanking'
    GroupRuntime:
      type: object
      required:
        - selection
        - health
      properties:
        selection:
          type: object
          required:
            - tcp
            - udp
          properties:
            tcp:
              oneOf:
                - type: 'null'
                - $ref: '#/components/schemas/GroupSelection'
            udp:
              oneOf:
                - type: 'null'
                - $ref: '#/components/schemas/GroupSelection'
        health:
          type: array
          items:
            $ref: '#/components/schemas/GroupHealthObservation'
    GroupCapabilities:
      type: object
      required:
        - can_select
        - can_override
        - supports_nested_groups
        - mutable_config
        - probe_transports
      properties:
        can_select:
          type: boolean
          description: The policy is a manual selector; PUT selection replaces its choice.
        can_override:
          type: boolean
          description: The policy chooses automatically but accepts a pinned member; PUT selection pins, DELETE selection returns to automatic.
        supports_nested_groups:
          type: boolean
        mutable_config:
          type: array
          uniqueItems: true
          items:
            type: string
            enum:
              - policy
              - default_member_id
              - final_outbound
              - check_url
              - check_interval
              - tolerance
              - idle_timeout
              - interrupt_connections
        probe_transports:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/Transport'
    Group:
      type: object
      required:
        - id
        - name
        - icon
        - config_revision
        - policy
        - members
        - config
        - runtime
        - capabilities
      properties:
        id:
          type: string
          minLength: 1
        name:
          type: string
          minLength: 1
        icon:
          type:
            - string
            - 'null'
          maxLength: 2048
          description: An icon the configuration names for this group, as an absolute http(s) URL or a data URI the client shows beside the name; null when none is configured. Clients may let the user override it locally.
        config_revision:
          type: string
          minLength: 1
        policy:
          $ref: '#/components/schemas/GroupPolicy'
        members:
          type: array
          items:
            $ref: '#/components/schemas/GroupMember'
        config:
          $ref: '#/components/schemas/GroupConfig'
        runtime:
          $ref: '#/components/schemas/GroupRuntime'
        capabilities:
          $ref: '#/components/schemas/GroupCapabilities'
    GroupSummary:
      type: object
      required:
        - id
        - name
        - icon
        - config_revision
        - policy
        - member_count
        - selection
      properties:
        id:
          type: string
          minLength: 1
        name:
          type: string
          minLength: 1
        icon:
          type:
            - string
            - 'null'
          maxLength: 2048
          description: An icon the configuration names for this group, as an absolute http(s) URL or a data URI the client shows beside the name; null when none is configured. Clients may let the user override it locally.
        config_revision:
          type: string
          minLength: 1
          description: Same opaque configuration revision as Group.config_revision; preserve without numeric parsing.
        policy:
          $ref: '#/components/schemas/GroupPolicy'
        member_count:
          type: integer
          minimum: 0
        selection:
          type: object
          required:
            - tcp_member_id
            - udp_member_id
          properties:
            tcp_member_id:
              type:
                - string
                - 'null'
            udp_member_id:
              type:
                - string
                - 'null'
    GroupList:
      type: array
      items:
        $ref: '#/components/schemas/GroupSummary'
    JsonPatch:
      type: array
      minItems: 1
      items:
        oneOf:
          - $ref: '#/components/schemas/PolicyPatch'
          - $ref: '#/components/schemas/MemberIdPatch'
          - $ref: '#/components/schemas/OutboundPatch'
          - $ref: '#/components/schemas/CheckUrlPatch'
          - $ref: '#/components/schemas/PositiveIntegerPatch'
          - $ref: '#/components/schemas/TolerancePatch'
          - $ref: '#/components/schemas/IdleTimeoutPatch'
          - $ref: '#/components/schemas/InterruptPatch'
          - $ref: '#/components/schemas/RemovePatch'
          - $ref: '#/components/schemas/CopyMovePatch'
      description: Bounded by resources.groups.max_patch_operations.
    PolicyPatch:
      type: object
      additionalProperties: false
      required:
        - op
        - path
        - value
      properties:
        op:
          type: string
          enum:
            - add
            - replace
            - test
        path:
          type: string
          const: /policy
        value:
          $ref: '#/components/schemas/GroupPolicyRequest'
    MemberIdPatch:
      type: object
      additionalProperties: false
      required:
        - op
        - path
        - value
      properties:
        op:
          type: string
          enum:
            - add
            - replace
            - test
        path:
          type: string
          const: /config/default_member_id
        value:
          type:
            - string
            - 'null'
    OutboundPatch:
      type: object
      additionalProperties: false
      required:
        - op
        - path
        - value
      properties:
        op:
          type: string
          enum:
            - add
            - replace
            - test
        path:
          type: string
          const: /config/final_outbound
        value:
          type:
            - string
            - 'null'
    CheckUrlPatch:
      type: object
      additionalProperties: false
      required:
        - op
        - path
        - value
      properties:
        op:
          type: string
          enum:
            - add
            - replace
            - test
        path:
          type: string
          const: /config/check_url
        value:
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/SafeHttpUrl'
    PositiveIntegerPatch:
      type: object
      additionalProperties: false
      required:
        - op
        - path
        - value
      properties:
        op:
          type: string
          enum:
            - add
            - replace
            - test
        path:
          type: string
          enum:
            - /config/check_interval
        value:
          type:
            - integer
            - 'null'
          minimum: 1
    TolerancePatch:
      type: object
      additionalProperties: false
      required:
        - op
        - path
        - value
      properties:
        op:
          type: string
          enum:
            - add
            - replace
            - test
        path:
          type: string
          const: /config/tolerance
        value:
          type:
            - number
            - 'null'
          minimum: 0
    IdleTimeoutPatch:
      type: object
      additionalProperties: false
      required:
        - op
        - path
        - value
      properties:
        op:
          type: string
          enum:
            - add
            - replace
            - test
        path:
          type: string
          const: /config/idle_timeout
        value:
          type:
            - integer
            - 'null'
          minimum: 0
    InterruptPatch:
      type: object
      additionalProperties: false
      required:
        - op
        - path
        - value
      properties:
        op:
          type: string
          enum:
            - add
            - replace
            - test
        path:
          type: string
          const: /config/interrupt_connections
        value:
          type: boolean
    MutableGroupPath:
      type: string
      enum:
        - /policy
        - /config/default_member_id
        - /config/final_outbound
        - /config/check_url
        - /config/check_interval
        - /config/tolerance
        - /config/idle_timeout
        - /config/interrupt_connections
    RemovePatch:
      type: object
      additionalProperties: false
      required:
        - op
        - path
      properties:
        op:
          const: remove
        path:
          $ref: '#/components/schemas/MutableGroupPath'
    CopyMovePatch:
      type: object
      additionalProperties: false
      required:
        - op
        - path
        - from
      properties:
        op:
          enum:
            - copy
            - move
        path:
          $ref: '#/components/schemas/MutableGroupPath'
        from:
          $ref: '#/components/schemas/MutableGroupPath'
    GroupSelectionRequest:
      type: object
      additionalProperties: false
      required:
        - member_id
        - network
      properties:
        member_id:
          type: string
          minLength: 1
        network:
          type: string
          enum:
            - tcp
            - udp
            - both
    GroupSelectionResult:
      type: object
      required:
        - group_id
        - member_id
        - network
        - source
        - selection_revision
        - connections_interrupted
      properties:
        group_id:
          type: string
          minLength: 1
        member_id:
          type: string
          minLength: 1
        resolved_leaf_node_id:
          type:
            - string
            - 'null'
        network:
          type: string
          enum:
            - tcp
            - udp
            - both
        source:
          type: string
          enum:
            - runtime
            - override
            - policy
          description: runtime for a selector, override while a pinned member stands, policy once the automatic choice is back.
        selection_revision:
          type: string
          minLength: 1
        connections_interrupted:
          type: boolean
    ProbeKind:
      type: string
      enum:
        - tcp_connect
        - http
        - dns
    ProbeTarget:
      unevaluatedProperties: false
      oneOf:
        - $ref: '#/components/schemas/NodeProbeTarget'
        - $ref: '#/components/schemas/GroupProbeTarget'
    NodeProbeTarget:
      type: object
      required:
        - type
        - node_id
      properties:
        type:
          type: string
          const: node
        node_id:
          type: string
          minLength: 1
    GroupProbeTarget:
      type: object
      required:
        - type
        - group_id
      properties:
        type:
          type: string
          const: group
        group_id:
          type: string
          minLength: 1
    ProbeTargetResponse:
      oneOf:
        - $ref: '#/components/schemas/NodeProbeTarget'
        - $ref: '#/components/schemas/GroupProbeTarget'
    ProbeMembers:
      oneOf:
        - type: string
          enum:
            - direct
            - leaves
        - type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            minLength: 1
    ProbeRequest:
      type: object
      additionalProperties: false
      required:
        - target
        - kind
        - purpose
        - transport
        - ip_version
        - warmth
      properties:
        target:
          $ref: '#/components/schemas/ProbeTarget'
        kind:
          $ref: '#/components/schemas/ProbeKind'
        purpose:
          type: string
          enum:
            - data
            - dns
        transport:
          type: array
          minItems: 1
          maxItems: 2
          uniqueItems: true
          items:
            $ref: '#/components/schemas/Transport'
        ip_version:
          type: string
          enum:
            - ipv4
            - ipv6
            - any
        members:
          $ref: '#/components/schemas/ProbeMembers'
          default: direct
        warmth:
          type: string
          enum:
            - cold
            - warm
      allOf:
        - if:
            properties:
              target:
                properties:
                  type:
                    const: node
                required:
                  - type
          then:
            not:
              required:
                - members
        - oneOf:
            - properties:
                kind:
                  const: tcp_connect
                purpose:
                  const: data
                transport:
                  type: array
                  minItems: 1
                  maxItems: 1
                  items:
                    const: tcp
            - properties:
                kind:
                  const: http
                purpose:
                  const: data
                transport:
                  type: array
                  minItems: 1
                  maxItems: 1
                  items:
                    const: tcp
            - properties:
                kind:
                  const: dns
                purpose:
                  const: dns
    ProbeResultItem:
      type: object
      required:
        - member_id
        - resolved_leaf_node_id
        - kind
        - purpose
        - transport
        - ip_version
        - warmth
        - state
        - latency_ms
        - health_updated
        - error
        - observed_at
      properties:
        member_id:
          type: string
          minLength: 1
        resolved_leaf_node_id:
          type:
            - string
            - 'null'
        kind:
          $ref: '#/components/schemas/ProbeKind'
        purpose:
          type: string
          enum:
            - data
            - dns
        transport:
          $ref: '#/components/schemas/Transport'
        ip_version:
          $ref: '#/components/schemas/IpVersion'
        warmth:
          type: string
          enum:
            - cold
            - warm
            - unknown
        state:
          type: string
          enum:
            - healthy
            - unavailable
            - unknown
        latency_ms:
          type:
            - number
            - 'null'
          minimum: 0
        health_updated:
          type: boolean
        error:
          type:
            - string
            - 'null'
        observed_at:
          $ref: '#/components/schemas/Timestamp'
      allOf:
        - if:
            properties:
              state:
                enum:
                  - unavailable
                  - unknown
          then:
            properties:
              latency_ms:
                type: 'null'
    ProbeResult:
      type: object
      required:
        - target
        - selection_changed
        - selection_before
        - selection_after
        - results
      properties:
        target:
          $ref: '#/components/schemas/ProbeTargetResponse'
        selection_changed:
          $ref: '#/components/schemas/TransportBooleanMap'
        selection_before:
          $ref: '#/components/schemas/TransportSelectionMap'
        selection_after:
          $ref: '#/components/schemas/TransportSelectionMap'
        results:
          type: array
          items:
            $ref: '#/components/schemas/ProbeResultItem'
    TransportBooleanMap:
      type: object
      required:
        - tcp
        - udp
      properties:
        tcp:
          type: boolean
        udp:
          type: boolean
    TransportSelectionMap:
      type: object
      required:
        - tcp
        - udp
      properties:
        tcp:
          type:
            - string
            - 'null'
        udp:
          type:
            - string
            - 'null'
    ConnectionState:
      type: string
      enum:
        - observed
        - routing
        - dialing
        - active
        - closed
        - blocked
        - failed
        - unknown
    Connection:
      type: object
      required:
        - id
        - flow_id
        - pname
        - state
        - outbound
        - chain
        - chain_source
        - rule_id
        - rule_expression
        - rule_source
        - ingress
        - domain_source
        - started_at
        - observed_by
        - upload_bytes
        - download_bytes
        - upload_bytes_per_second
        - download_bytes_per_second
      properties:
        id:
          type: string
          minLength: 1
        flow_id:
          type:
            - string
            - 'null'
        pname:
          type:
            - string
            - 'null'
        state:
          $ref: '#/components/schemas/ConnectionState'
        src:
          type: string
          minLength: 1
        dst:
          type: string
          minLength: 1
        domain:
          type:
            - string
            - 'null'
        outbound:
          type:
            - string
            - 'null'
        chain:
          type: array
          items:
            type: string
          description: Application outbound selection_path group IDs followed by the leaf node ID, in order; empty for direct/block or an unknown path.
        chain_source:
          type: string
          enum:
            - evaluation
            - reconstructed
            - unknown
          description: Selection captured at evaluation, reconstructed from retained evidence, or unavailable; never a current group snapshot.
        rule_id:
          type:
            - string
            - 'null'
          description: Generation-scoped traffic rule ID, or null when unavailable.
        rule_expression:
          type:
            - string
            - 'null'
          description: Sanitized display expression for that rule, or null when unavailable.
        rule_source:
          type: string
          enum:
            - kernel
            - recomputed
            - unknown
          description: Deciding kernel rule, recomputed userspace evidence, or unavailable provenance; see honk-mapping's matched_rule row.
        ingress:
          type:
            - string
            - 'null'
          enum:
            - lan
            - wan
            - null
        domain_source:
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/DomainSource'
        started_at:
          $ref: '#/components/schemas/NullableTimestamp'
        observed_by:
          $ref: '#/components/schemas/ObservedBy'
        upload_bytes:
          $ref: '#/components/schemas/NullableUInt64'
        download_bytes:
          $ref: '#/components/schemas/NullableUInt64'
        upload_bytes_per_second:
          $ref: '#/components/schemas/NullableUInt64'
        download_bytes_per_second:
          $ref: '#/components/schemas/NullableUInt64'
    ConnectionList:
      type: object
      required:
        - observed_at
        - instance_id
        - visibility
        - truncated
        - tcp
        - udp
        - total_tcp
        - total_udp
      properties:
        observed_at:
          $ref: '#/components/schemas/Timestamp'
        instance_id:
          type: string
          minLength: 1
        visibility:
          $ref: '#/components/schemas/Visibility'
        truncated:
          type: boolean
          description: Whether limit omitted visible entries matching type and src.
        tcp:
          type: array
          items:
            $ref: '#/components/schemas/Connection'
        udp:
          type: array
          items:
            $ref: '#/components/schemas/Connection'
        total_tcp:
          $ref: '#/components/schemas/SafeUInt'
          description: Visible live TCP entries matching type and src before limit; zero when type excludes TCP.
        total_udp:
          $ref: '#/components/schemas/SafeUInt'
          description: Visible live UDP entries matching type and src before limit; zero when type excludes UDP.
    BulkCloseResult:
      type: object
      required:
        - closed
        - skipped
      description: Bounded JSON-number counts; closed + skipped cannot exceed resources.connections.max_bulk_close.
      properties:
        closed:
          $ref: '#/components/schemas/SafeUInt'
          description: Selected connections actually cancelled or retired by the userspace datapath.
        skipped:
          $ref: '#/components/schemas/SafeUInt'
          description: Selected connections observed but not closable; excludes entries that disappeared before cancellation.
    FlowScope:
      type: string
      enum:
        - userspace_tcp
        - userspace_udp
        - kernel_direct
        - kernel_block
        - dns_intercept
        - kernel_bypass
    TraceStatus:
      type: string
      enum:
        - complete
        - partial
        - disabled
    FlowInput:
      type: object
      required:
        - src
        - dst
        - domain
        - domain_source
        - pid
        - process_path
        - src_mac
        - ingress
        - domain_rule_ids
        - dscp
        - mark
      properties:
        src:
          type:
            - string
            - 'null'
        dst:
          type:
            - string
            - 'null'
        domain:
          type:
            - string
            - 'null'
        domain_source:
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/DomainSource'
        pid:
          $ref: '#/components/schemas/NullableSafeUInt'
        process_path:
          type:
            - string
            - 'null'
        src_mac:
          type:
            - string
            - 'null'
        ingress:
          type:
            - string
            - 'null'
          enum:
            - lan
            - wan
            - null
        domain_rule_ids:
          oneOf:
            - type: 'null'
            - type: array
              uniqueItems: true
              items:
                type: string
                minLength: 1
        dscp:
          type:
            - integer
            - 'null'
          minimum: 0
          maximum: 63
        mark:
          type:
            - integer
            - 'null'
          minimum: 0
          maximum: 4294967295
    TrafficRoutingInput:
      type: object
      required:
        - network
        - src_ip
        - src_port
        - dst_ip
        - dst_port
        - domain
        - pname
        - src_mac
        - dscp
        - mark
        - ingress
        - domain_rule_ids
      properties:
        network:
          $ref: '#/components/schemas/Transport'
        src_ip:
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/IpAddress'
        src_port:
          type:
            - integer
            - 'null'
          minimum: 0
          maximum: 65535
        dst_ip:
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/IpAddress'
        dst_port:
          type:
            - integer
            - 'null'
          minimum: 0
          maximum: 65535
        domain:
          type:
            - string
            - 'null'
        pname:
          type:
            - string
            - 'null'
        src_mac:
          type:
            - string
            - 'null'
        dscp:
          type:
            - integer
            - 'null'
          minimum: 0
          maximum: 63
        mark:
          type:
            - integer
            - 'null'
          minimum: 0
          maximum: 4294967295
        ingress:
          type:
            - string
            - 'null'
          enum:
            - lan
            - wan
            - null
        domain_rule_ids:
          oneOf:
            - type: 'null'
            - type: array
              items:
                type: string
                minLength: 1
              uniqueItems: true
    DnsRequestRoutingInput:
      type: object
      required:
        - name
        - qtype
        - source_ip
        - original_dst
      properties:
        name:
          type: string
          minLength: 1
        qtype:
          $ref: '#/components/schemas/DnsRecordType'
        source_ip:
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/IpAddress'
        original_dst:
          type:
            - string
            - 'null'
    DnsResponseRoutingInput:
      type: object
      required:
        - name
        - qtype
        - answer_ips
        - from_upstream
      properties:
        name:
          type: string
          minLength: 1
        qtype:
          $ref: '#/components/schemas/DnsRecordType'
        answer_ips:
          type: array
          items:
            $ref: '#/components/schemas/IpAddress'
        from_upstream:
          type: string
          minLength: 1
    DomainSource:
      type: string
      enum:
        - tls_sni
        - http_host
        - quic_sni
        - dns_mapping
        - explicit
        - unknown
    FlowSummary:
      type: object
      required:
        - id
        - instance_id
        - revision
        - network
        - state
        - pname
        - connection_id
        - outbound
        - chain
        - chain_source
        - rule_id
        - rule_expression
        - rule_source
        - ingress
        - domain_source
        - observed_by
        - started_at
        - ended_at
        - trace_status
      properties:
        id:
          type: string
          minLength: 1
        instance_id:
          type: string
          minLength: 1
        revision:
          type: integer
          minimum: 1
          maximum: 9007199254740991
        network:
          $ref: '#/components/schemas/Transport'
        state:
          $ref: '#/components/schemas/ConnectionState'
        pname:
          type:
            - string
            - 'null'
        connection_id:
          type:
            - string
            - 'null'
        outbound:
          type:
            - string
            - 'null'
        chain:
          type: array
          items:
            type: string
          description: Application outbound selection_path group IDs followed by the leaf node ID, in order; empty for direct/block or an unknown path.
        chain_source:
          type: string
          enum:
            - evaluation
            - reconstructed
            - unknown
          description: Selection captured at evaluation, reconstructed from retained evidence, or unavailable; never a current group snapshot.
        rule_id:
          type:
            - string
            - 'null'
          description: Generation-scoped traffic rule ID, or null when unavailable.
        rule_expression:
          type:
            - string
            - 'null'
          description: Sanitized display expression for that rule, or null when unavailable.
        rule_source:
          type: string
          enum:
            - kernel
            - recomputed
            - unknown
          description: Deciding kernel rule, recomputed userspace evidence, or unavailable provenance; see honk-mapping's matched_rule row.
        ingress:
          type:
            - string
            - 'null'
          enum:
            - lan
            - wan
            - null
        domain_source:
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/DomainSource'
        observed_by:
          $ref: '#/components/schemas/ObservedBy'
        started_at:
          $ref: '#/components/schemas/NullableTimestamp'
        ended_at:
          $ref: '#/components/schemas/NullableTimestamp'
        trace_status:
          $ref: '#/components/schemas/TraceStatus'
        input:
          $ref: '#/components/schemas/FlowInput'
    FlowCoverage:
      type: object
      required:
        - userspace_tcp
        - userspace_udp
        - kernel_direct
        - kernel_block
        - dns_intercept
        - kernel_bypass
      properties:
        userspace_tcp:
          $ref: '#/components/schemas/Visibility'
        userspace_udp:
          $ref: '#/components/schemas/Visibility'
        kernel_direct:
          $ref: '#/components/schemas/Visibility'
        kernel_block:
          $ref: '#/components/schemas/Visibility'
        dns_intercept:
          $ref: '#/components/schemas/Visibility'
        kernel_bypass:
          $ref: '#/components/schemas/Visibility'
    FlowList:
      type: object
      required:
        - instance_id
        - observed_at
        - coverage
        - dropped_records
        - flows
        - next_cursor
      properties:
        instance_id:
          type: string
          minLength: 1
        observed_at:
          $ref: '#/components/schemas/Timestamp'
        coverage:
          $ref: '#/components/schemas/FlowCoverage'
        dropped_records:
          $ref: '#/components/schemas/NullableUInt64'
        flows:
          type: array
          items:
            $ref: '#/components/schemas/FlowSummary'
        next_cursor:
          type:
            - string
            - 'null'
    FlowDetail:
      allOf:
        - $ref: '#/components/schemas/FlowSummary'
        - type: object
          required:
            - input
            - trace
          properties:
            input:
              $ref: '#/components/schemas/FlowInput'
            trace:
              $ref: '#/components/schemas/FlowTrace'
          not:
            required:
              - mode
        - oneOf:
            - properties:
                trace_status:
                  const: complete
                trace:
                  properties:
                    status:
                      const: complete
            - properties:
                trace_status:
                  const: partial
                trace:
                  properties:
                    status:
                      const: partial
            - properties:
                trace_status:
                  const: disabled
                trace:
                  properties:
                    status:
                      const: disabled
      description: Recorded evidence identified by id and instance_id; never a simulation.
    FlowTrace:
      type: object
      required:
        - status
        - missing
        - steps
      properties:
        status:
          $ref: '#/components/schemas/TraceStatus'
        missing:
          type: array
          uniqueItems: true
          items:
            type: string
            enum:
              - not_instrumented
              - started_late
              - buffer_overflow
              - sampled
              - redacted
              - evicted
        steps:
          type: array
          items:
            $ref: '#/components/schemas/FlowStep'
      if:
        properties:
          status:
            const: complete
      then:
        properties:
          missing:
            maxItems: 0
          steps:
            items:
              properties:
                evidence:
                  const: observed
              if:
                properties:
                  stage:
                    const: route
              then:
                properties:
                  data:
                    properties:
                      input:
                        type: object
      else:
        properties:
          missing:
            minItems: 1
    FlowStep:
      oneOf:
        - $ref: '#/components/schemas/InputStep'
        - $ref: '#/components/schemas/RouteStep'
        - $ref: '#/components/schemas/DatapathStep'
        - $ref: '#/components/schemas/DialModeStep'
        - $ref: '#/components/schemas/DnsStep'
        - $ref: '#/components/schemas/RerouteStep'
        - $ref: '#/components/schemas/OutboundStep'
        - $ref: '#/components/schemas/ConnectionStep'
      discriminator:
        propertyName: stage
        mapping:
          input: '#/components/schemas/InputStep'
          route: '#/components/schemas/RouteStep'
          datapath: '#/components/schemas/DatapathStep'
          dial_mode: '#/components/schemas/DialModeStep'
          dns: '#/components/schemas/DnsStep'
          reroute: '#/components/schemas/RerouteStep'
          outbound: '#/components/schemas/OutboundStep'
          connection: '#/components/schemas/ConnectionStep'
    InputStep:
      allOf:
        - $ref: '#/components/schemas/StepCommon'
        - type: object
          required:
            - stage
            - data
          properties:
            stage:
              const: input
            data:
              $ref: '#/components/schemas/InputStepData'
    InputStepData:
      type: object
      required:
        - values
        - source
      properties:
        values:
          allOf:
            - $ref: '#/components/schemas/FlowInput'
            - type: object
              required:
                - pname
              properties:
                pname:
                  type:
                    - string
                    - 'null'
        source:
          type: string
          enum:
            - kernel
            - socket
            - sniffer
            - dns_mapping
    RouteStep:
      allOf:
        - $ref: '#/components/schemas/StepCommon'
        - type: object
          required:
            - stage
            - data
          properties:
            stage:
              const: route
            data:
              $ref: '#/components/schemas/RouteStepData'
    RouteStepData:
      type: object
      required:
        - evaluation_id
        - chain
        - plane
        - rule_id
        - rules
        - outbound
        - must
        - mark
        - input
        - dns_action
      properties:
        evaluation_id:
          type: string
          minLength: 1
        chain:
          type: string
          enum:
            - traffic
            - dns_request
            - dns_response
            - dns_upstream
        plane:
          type: string
          enum:
            - kernel
            - userspace
        rule_id:
          type:
            - string
            - 'null'
        rules:
          type: array
          items:
            $ref: '#/components/schemas/RuleEvaluation'
        outbound:
          type:
            - string
            - 'null'
          description: Traffic outbound, or DNS upstream tag for upstream/requery; null for other DNS actions.
        must:
          type:
            - boolean
            - 'null'
        mark:
          type:
            - integer
            - 'null'
          minimum: 0
          maximum: 4294967295
        input:
          type:
            - object
            - 'null'
          additionalProperties: true
          description: Immutable inputs consumed by this evaluation, typed by chain below; null means missing capture.
        dns_action:
          type:
            - string
            - 'null'
          enum:
            - upstream
            - asis
            - accept
            - reject
            - requery
            - null
      allOf:
        - oneOf:
            - properties:
                chain:
                  enum:
                    - traffic
                    - dns_upstream
                input:
                  oneOf:
                    - type: 'null'
                    - $ref: '#/components/schemas/TrafficRoutingInput'
                dns_action:
                  type: 'null'
            - properties:
                chain:
                  const: dns_request
                input:
                  oneOf:
                    - type: 'null'
                    - $ref: '#/components/schemas/DnsRequestRoutingInput'
                dns_action:
                  enum:
                    - upstream
                    - asis
                    - reject
                    - null
                must:
                  type: 'null'
                mark:
                  type: 'null'
            - properties:
                chain:
                  const: dns_response
                input:
                  oneOf:
                    - type: 'null'
                    - $ref: '#/components/schemas/DnsResponseRoutingInput'
                dns_action:
                  enum:
                    - accept
                    - reject
                    - requery
                    - null
                must:
                  type: 'null'
                mark:
                  type: 'null'
        - if:
            properties:
              dns_action:
                enum:
                  - asis
                  - accept
                  - reject
          then:
            properties:
              outbound:
                type: 'null'
    DatapathStep:
      allOf:
        - $ref: '#/components/schemas/StepCommon'
        - type: object
          required:
            - stage
            - data
          properties:
            stage:
              const: datapath
            data:
              $ref: '#/components/schemas/DatapathStepData'
    DatapathStepData:
      type: object
      required:
        - plane
        - action
        - reason
        - error
      properties:
        plane:
          type: string
          enum:
            - kernel
            - userspace
        action:
          type: string
          enum:
            - pass
            - redirect
            - hold
            - arm_direct
            - activate_direct
            - activate_proxy
            - drop
        reason:
          type: string
          minLength: 1
        error:
          type:
            - string
            - 'null'
    DialModeStep:
      allOf:
        - $ref: '#/components/schemas/StepCommon'
        - type: object
          required:
            - stage
            - data
          properties:
            stage:
              const: dial_mode
            data:
              $ref: '#/components/schemas/DialModeStepData'
    DialModeStepData:
      type: object
      required:
        - configured
        - effective_target
        - domain
        - domain_source
        - verification
        - reason
      properties:
        configured:
          type: string
          minLength: 1
        effective_target:
          type: string
          enum:
            - ip
            - domain
            - none
            - unknown
        domain:
          type:
            - string
            - 'null'
        domain_source:
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/DomainSource'
        verification:
          type: string
          enum:
            - matched
            - other_family_trusted
            - failed
            - not_required
            - unavailable
        reason:
          type: string
          minLength: 1
    DnsStep:
      allOf:
        - $ref: '#/components/schemas/StepCommon'
        - type: object
          required:
            - stage
            - data
          properties:
            stage:
              const: dns
            data:
              $ref: '#/components/schemas/DnsStepData'
    DnsStepData:
      type: object
      required:
        - lookup_id
        - parent_lookup_id
        - attempt_id
        - purpose
        - name
        - qtype
        - source
        - upstream_transport
        - carrier_transport
        - cache
        - cache_entry_id
        - upstream
        - route_evaluation_ids
        - status
        - addresses
        - selected_ip
        - error
      properties:
        lookup_id:
          type: string
          minLength: 1
        parent_lookup_id:
          type:
            - string
            - 'null'
        attempt_id:
          type:
            - string
            - 'null'
        purpose:
          type: string
          enum:
            - domain_verification
            - dial_target
            - proxy_server
            - intercepted_query
            - family_preference
            - refresh
        name:
          type: string
          minLength: 1
        qtype:
          $ref: '#/components/schemas/DnsRecordType'
        source:
          type: string
          enum:
            - hosts
            - cache
            - upstream
            - coalesced
            - unknown
        upstream_transport:
          type:
            - string
            - 'null'
          enum:
            - udp
            - tcp
            - dot
            - doh
            - doq
            - doh3
            - null
        carrier_transport:
          type:
            - string
            - 'null'
          enum:
            - tcp
            - udp
            - null
        cache:
          type: string
          enum:
            - hit
            - miss
            - stale
            - bypass
            - unknown
        cache_entry_id:
          type:
            - string
            - 'null'
        upstream:
          type:
            - string
            - 'null'
        route_evaluation_ids:
          type: array
          uniqueItems: true
          items:
            type: string
            minLength: 1
        status:
          type: string
          minLength: 1
        addresses:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/IpAddress'
        selected_ip:
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/IpAddress'
        error:
          type:
            - string
            - 'null'
    RerouteStep:
      allOf:
        - $ref: '#/components/schemas/StepCommon'
        - type: object
          required:
            - stage
            - data
          properties:
            stage:
              const: reroute
            data:
              $ref: '#/components/schemas/RerouteStepData'
    RerouteStepData:
      type: object
      required:
        - performed
        - reason
        - from_evaluation_id
        - to_evaluation_id
      properties:
        performed:
          type:
            - boolean
            - 'null'
        reason:
          type: string
          minLength: 1
        from_evaluation_id:
          type:
            - string
            - 'null'
        to_evaluation_id:
          type:
            - string
            - 'null'
    OutboundStep:
      allOf:
        - $ref: '#/components/schemas/StepCommon'
        - type: object
          required:
            - stage
            - data
          properties:
            stage:
              const: outbound
            data:
              $ref: '#/components/schemas/OutboundStepData'
    OutboundStepData:
      type: object
      required:
        - attempt_id
        - parent_attempt_id
        - kind
        - evaluation_id
        - routing_source
        - routed_outbound
        - effective_outbound
        - mode_override
        - selection_path
        - leaf_node_id
        - leaf_node_name
        - target
        - target_kind
        - dial_ip
        - server_addr
        - resolution_location
        - status
        - error
      properties:
        attempt_id:
          type: string
          minLength: 1
        parent_attempt_id:
          type:
            - string
            - 'null'
        kind:
          type: string
          enum:
            - leaf
            - transport
        evaluation_id:
          type:
            - string
            - 'null'
          minLength: 1
        routing_source:
          type: string
          enum:
            - evaluation
            - forced
            - builtin
            - unknown
        routed_outbound:
          type:
            - string
            - 'null'
        effective_outbound:
          type:
            - string
            - 'null'
        mode_override:
          type: string
          enum:
            - none
            - direct
            - global
            - unknown
        selection_path:
          type: array
          items:
            $ref: '#/components/schemas/SelectionPathItem'
        leaf_node_id:
          type:
            - string
            - 'null'
        leaf_node_name:
          type:
            - string
            - 'null'
          description: Sanitized leaf name captured at decision time, or null when unavailable; leaf_node_id remains authoritative.
        target:
          type:
            - string
            - 'null'
        target_kind:
          type: string
          enum:
            - ip
            - domain
            - none
            - unknown
        dial_ip:
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/IpAddress'
        server_addr:
          type:
            - string
            - 'null'
        resolution_location:
          type: string
          enum:
            - original_ip
            - local_dns
            - outbound_remote
            - not_applicable
            - unknown
        status:
          type: string
          enum:
            - started
            - succeeded
            - failed
            - cancelled
        error:
          type:
            - string
            - 'null'
      if:
        properties:
          routing_source:
            const: evaluation
      then:
        properties:
          evaluation_id:
            type: string
      else:
        properties:
          evaluation_id:
            type: 'null'
    SelectionPathItem:
      type: object
      required:
        - group_id
        - member_id
        - member_name
        - policy
        - reason
        - selection
      properties:
        group_id:
          type: string
          minLength: 1
        member_id:
          type:
            - string
            - 'null'
          minLength: 1
        member_name:
          type:
            - string
            - 'null'
          description: Sanitized member name captured at decision time, or null when unavailable; member_id remains authoritative.
        policy:
          type: string
          minLength: 1
        reason:
          type: string
          minLength: 1
        selection:
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/SelectionDecision'
    SelectionDecision:
      type: object
      required:
        - previous_member_id
        - metric
        - tolerance_ms
        - candidates
      properties:
        previous_member_id:
          type:
            - string
            - 'null'
        metric:
          type:
            - string
            - 'null'
        tolerance_ms:
          type:
            - number
            - 'null'
        candidates:
          type: array
          items:
            $ref: '#/components/schemas/SelectionCandidate'
    SelectionCandidate:
      type: object
      required:
        - member_id
        - member_name
        - leaf_node_id
        - leaf_node_name
        - eligible
        - sorting_latency_ms
        - score
        - selected
        - reason
      properties:
        member_id:
          type: string
          minLength: 1
        member_name:
          type:
            - string
            - 'null'
          description: Sanitized member name captured at decision time, or null when unavailable; member_id remains authoritative.
        leaf_node_id:
          type:
            - string
            - 'null'
        leaf_node_name:
          type:
            - string
            - 'null'
          description: Sanitized leaf name captured at decision time, or null when unavailable; leaf_node_id remains authoritative.
        eligible:
          type:
            - boolean
            - 'null'
        sorting_latency_ms:
          type:
            - number
            - 'null'
        score:
          type:
            - number
            - 'null'
        selected:
          type: boolean
        reason:
          type: string
          minLength: 1
    ConnectionStep:
      allOf:
        - $ref: '#/components/schemas/StepCommon'
        - type: object
          required:
            - stage
            - data
          properties:
            stage:
              const: connection
            data:
              $ref: '#/components/schemas/ConnectionStepData'
    ConnectionStepData:
      type: object
      required:
        - state
        - reason
        - milestone
        - attempt_id
        - reply_received
        - error
      properties:
        state:
          $ref: '#/components/schemas/ConnectionState'
        reason:
          type: string
          minLength: 1
        milestone:
          type: string
          enum:
            - transport_ready
            - target_request_sent
            - target_confirmed
            - first_reply
            - terminal
            - unknown
        attempt_id:
          type:
            - string
            - 'null'
        reply_received:
          type:
            - boolean
            - 'null'
        error:
          type:
            - string
            - 'null'
    RuleResult:
      type: string
      enum:
        - matched
        - not_matched
        - skipped
        - indeterminate
    RuleCondition:
      type: object
      required:
        - id
        - expression
        - result
        - missing_inputs
      properties:
        id:
          type: string
          minLength: 1
        expression:
          type:
            - string
            - 'null'
        result:
          $ref: '#/components/schemas/RuleResult'
        missing_inputs:
          type: array
          uniqueItems: true
          items:
            type: string
            minLength: 1
    RuleEvaluation:
      type: object
      required:
        - rule_id
        - expression
        - result
        - missing_inputs
        - conditions
      properties:
        rule_id:
          type: string
          minLength: 1
        expression:
          type:
            - string
            - 'null'
        result:
          $ref: '#/components/schemas/RuleResult'
        missing_inputs:
          type: array
          uniqueItems: true
          items:
            type: string
            minLength: 1
        conditions:
          type: array
          items:
            $ref: '#/components/schemas/RuleCondition'
    IpAddress:
      oneOf:
        - type: string
          format: ipv4
        - type: string
          format: ipv6
    RoutingTraceInput:
      type: object
      additionalProperties: false
      required:
        - network
        - dst_port
      properties:
        network:
          $ref: '#/components/schemas/Transport'
        domain:
          type:
            - string
            - 'null'
          minLength: 1
        dst_ip:
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/IpAddress'
        dst_port:
          type: integer
          minimum: 1
          maximum: 65535
        src_ip:
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/IpAddress'
        src_port:
          type:
            - integer
            - 'null'
          minimum: 1
          maximum: 65535
        pname:
          type:
            - string
            - 'null'
        dscp:
          type:
            - integer
            - 'null'
          minimum: 0
          maximum: 63
        mark:
          type:
            - integer
            - 'null'
          minimum: 0
          maximum: 4294967295
      anyOf:
        - required:
            - domain
          properties:
            domain:
              type: string
              minLength: 1
        - required:
            - dst_ip
          properties:
            dst_ip:
              $ref: '#/components/schemas/IpAddress'
    RoutingTraceRequest:
      type: object
      additionalProperties: false
      required:
        - input
      properties:
        input:
          $ref: '#/components/schemas/RoutingTraceInput'
        resolve:
          type: string
          enum:
            - none
            - live
          default: none
      allOf:
        - if:
            required:
              - resolve
            properties:
              resolve:
                const: live
          then:
            properties:
              input:
                allOf:
                  - required:
                      - domain
                    properties:
                      domain:
                        type: string
                        minLength: 1
                  - properties:
                      dst_ip:
                        type: 'null'
    RoutingEvaluation:
      type: object
      required:
        - dst_ip
        - decision
        - outbound
        - missing_inputs
        - rules
      properties:
        dst_ip:
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/IpAddress'
        decision:
          type: string
          enum:
            - determinate
            - indeterminate
        outbound:
          type:
            - string
            - 'null'
        missing_inputs:
          type: array
          uniqueItems: true
          items:
            type: string
            minLength: 1
        rules:
          type: array
          items:
            $ref: '#/components/schemas/RuleEvaluation'
    SimulationDnsData:
      allOf:
        - $ref: '#/components/schemas/DnsStepData'
        - type: object
          properties:
            lookup_id:
              type: string
              minLength: 1
              description: Simulation-local lookup ID; never a recorded-flow identity.
            purpose:
              const: dial_target
            attempt_id:
              type: 'null'
              description: Simulations never create outbound attempts.
    RoutingTraceResponse:
      type: object
      required:
        - mode
        - instance_id
        - generation_id
        - observed_at
        - evaluations
        - dns
      properties:
        mode:
          type: string
          const: simulation
        instance_id:
          type: string
          minLength: 1
        generation_id:
          type: string
          minLength: 1
        observed_at:
          $ref: '#/components/schemas/Timestamp'
        evaluations:
          type: array
          items:
            $ref: '#/components/schemas/RoutingEvaluation'
        dns:
          type: array
          items:
            $ref: '#/components/schemas/SimulationDnsData'
      not:
        anyOf:
          - required:
              - id
          - required:
              - flow_id
          - required:
              - connection_id
      description: Hypothetical output. It never identifies or claims history for a live flow.
    RuleSource:
      oneOf:
        - type: 'null'
        - type: object
          required:
            - file
            - line
          properties:
            file:
              type: string
              minLength: 1
              description: Redacted source label; never an absolute local path or credential-bearing URL.
            line:
              $ref: '#/components/schemas/SafeUInt'
              minimum: 1
      description: Source location, or null when unavailable or unsafe to disclose.
    RoutingRule:
      type: object
      required:
        - rule_id
        - index
        - expression
        - outbound
        - must
        - source
        - kind
      properties:
        rule_id:
          type: string
          minLength: 1
          description: Identical to POST /routing/trace rule IDs and FlowSummary.rule_id within the same generation; opaque to clients.
        index:
          $ref: '#/components/schemas/SafeUInt'
          description: Zero-based evaluation order within this generation, not a cross-generation identity.
        expression:
          type: string
          minLength: 1
          description: Safe display expression, not raw configuration or an editable source representation.
        outbound:
          type: string
          minLength: 1
          description: Rule outbound, not a resolved leaf node or a claim of a successful dial.
        must:
          type: boolean
        source:
          $ref: '#/components/schemas/RuleSource'
        kind:
          type: string
          enum:
            - rule
            - fallback
    RuleFallback:
      type: object
      required:
        - outbound
        - source
      properties:
        outbound:
          type: string
          minLength: 1
        source:
          $ref: '#/components/schemas/RuleSource'
      description: Same outbound and source as the fallback entry in rules; the entry carries its rule_id.
    RuleList:
      type: object
      required:
        - generation_id
        - rules
        - fallback
      properties:
        generation_id:
          type: string
          minLength: 1
        rules:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/RoutingRule'
          contains:
            type: object
            required:
              - kind
            properties:
              kind:
                const: fallback
          minContains: 1
          maxContains: 1
          description: Complete evaluation order with unique rule_id and index values, including exactly one final fallback entry.
        fallback:
          $ref: '#/components/schemas/RuleFallback'
    DnsRecordType:
      type: string
      pattern: ^(?:[A-Z][A-Z0-9-]*|TYPE[0-9]{1,5}|[0-9]{1,5})$
    DnsAnswer:
      type: object
      required:
        - name
        - type
        - class
        - ttl
        - data
      properties:
        name:
          type: string
          minLength: 1
        type:
          $ref: '#/components/schemas/DnsRecordType'
        class:
          type: string
          minLength: 1
        ttl:
          type: integer
          minimum: 0
          maximum: 4294967295
        data:
          type: string
    DnsQuestion:
      type: object
      required:
        - name
        - type
      properties:
        name:
          type: string
          minLength: 1
        type:
          $ref: '#/components/schemas/DnsRecordType'
    DnsRoute:
      type: object
      required:
        - source
        - rule
      properties:
        source:
          type: string
          enum:
            - forced
            - dns.routing
            - default
        rule:
          type:
            - string
            - 'null'
    DnsQueryResult:
      type: object
      required:
        - type
        - cached
        - cache_entry_id
        - upstream
        - route
        - status
        - elapsed_ms
        - question
      properties:
        type:
          $ref: '#/components/schemas/DnsRecordType'
        cached:
          type: boolean
        cache_entry_id:
          type:
            - string
            - 'null'
        upstream:
          type:
            - string
            - 'null'
        route:
          $ref: '#/components/schemas/DnsRoute'
        status:
          type: string
          minLength: 1
        elapsed_ms:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        question:
          $ref: '#/components/schemas/DnsQuestion'
        answers:
          type: array
          items:
            $ref: '#/components/schemas/DnsAnswer'
    DnsQueryResponse:
      type: object
      required:
        - domain
        - cache_mode
        - query_time
        - results
      properties:
        domain:
          type: string
          minLength: 1
        cache_mode:
          type: string
          enum:
            - normal
            - bypass
        query_time:
          $ref: '#/components/schemas/Timestamp'
        results:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/DnsQueryResult'
    DnsCacheCoverage:
      type: object
      required:
        - positive
        - negative
        - persistent
      properties:
        positive:
          type: boolean
        negative:
          type: boolean
        persistent:
          type: boolean
    DnsCacheEntry:
      type: object
      required:
        - entry_id
        - domain
        - type
        - class
        - status
        - expires_at
        - stale_until
      properties:
        entry_id:
          type: string
          minLength: 1
        domain:
          type: string
          minLength: 2
          pattern: \.$
        type:
          $ref: '#/components/schemas/DnsRecordType'
        class:
          type: string
          minLength: 1
        status:
          type: string
          minLength: 1
        answers:
          type: array
          items:
            $ref: '#/components/schemas/DnsAnswer'
        expires_at:
          $ref: '#/components/schemas/Timestamp'
        stale_until:
          $ref: '#/components/schemas/NullableTimestamp'
    DnsCacheList:
      type: object
      required:
        - observed_at
        - coverage
        - entries
        - total
        - next_cursor
      properties:
        observed_at:
          $ref: '#/components/schemas/Timestamp'
        coverage:
          $ref: '#/components/schemas/DnsCacheCoverage'
        entries:
          type: array
          items:
            $ref: '#/components/schemas/DnsCacheEntry'
        total:
          $ref: '#/components/schemas/SafeUInt'
        next_cursor:
          type:
            - string
            - 'null'
    DnsLogRecord:
      type: object
      required:
        - id
        - observed_at
        - src
        - question
        - status
        - cached
        - upstream
        - route
        - elapsed_ms
        - answers
      properties:
        id:
          type: string
          minLength: 1
          description: Opaque, unique within the running instance; the cursor is derived from it.
        observed_at:
          $ref: '#/components/schemas/Timestamp'
        src:
          type:
            - string
            - 'null'
          description: Client socket address, IPv6 in brackets; null when the resolver itself asked.
        question:
          $ref: '#/components/schemas/DnsQuestion'
        status:
          type: string
          minLength: 1
          description: RCODE name such as NOERROR or NXDOMAIN, or an engine outcome such as TIMEOUT.
        cached:
          type: boolean
        upstream:
          type:
            - string
            - 'null'
          description: The upstream that answered, null on a cache hit or failure before sending.
        route:
          $ref: '#/components/schemas/DnsRoute'
        elapsed_ms:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        answers:
          type: array
          items:
            $ref: '#/components/schemas/DnsAnswer'
    DnsLogList:
      type: object
      required:
        - observed_at
        - total
        - next_cursor
        - records
      properties:
        observed_at:
          $ref: '#/components/schemas/Timestamp'
        total:
          $ref: '#/components/schemas/SafeUInt'
          description: Records in the ring at observed_at, before filters.
        next_cursor:
          type:
            - string
            - 'null'
        records:
          type: array
          items:
            $ref: '#/components/schemas/DnsLogRecord'
    DeleteCount:
      type: object
      required:
        - deleted
      properties:
        deleted:
          type: integer
          minimum: 0
    DeleteMatchingCount:
      type: object
      required:
        - matched
        - deleted
      properties:
        matched:
          type: integer
          minimum: 0
        deleted:
          type: integer
          minimum: 0
    OperationKind:
      type: string
      enum:
        - probe
        - reload
        - suspend
        - resume
        - group_update
        - provider_refresh
    OperationAccepted:
      type: object
      required:
        - operation_id
        - kind
        - status
        - href
      properties:
        operation_id:
          type: string
          minLength: 1
        kind:
          $ref: '#/components/schemas/OperationKind'
        status:
          type: string
          const: queued
        href:
          type: string
          pattern: ^/api/v1/operations/[^/]+$
    Operation:
      oneOf:
        - $ref: '#/components/schemas/QueuedOperation'
        - $ref: '#/components/schemas/RunningOperation'
        - $ref: '#/components/schemas/FailedOperation'
        - $ref: '#/components/schemas/ProbeSucceededOperation'
        - $ref: '#/components/schemas/ReloadSucceededOperation'
        - $ref: '#/components/schemas/SuspendSucceededOperation'
        - $ref: '#/components/schemas/ResumeSucceededOperation'
        - $ref: '#/components/schemas/GroupUpdateSucceededOperation'
        - $ref: '#/components/schemas/ProviderRefreshSucceededOperation'
    QueuedOperation:
      allOf:
        - $ref: '#/components/schemas/OperationCommon'
        - type: object
          properties:
            status:
              const: queued
            started_at:
              type: 'null'
            finished_at:
              type: 'null'
            result:
              type: 'null'
            error:
              type: 'null'
    RunningOperation:
      allOf:
        - $ref: '#/components/schemas/OperationCommon'
        - type: object
          properties:
            status:
              const: running
            finished_at:
              type: 'null'
            result:
              type: 'null'
            error:
              type: 'null'
    FailedOperation:
      allOf:
        - $ref: '#/components/schemas/OperationCommon'
        - type: object
          properties:
            status:
              const: failed
            finished_at:
              $ref: '#/components/schemas/Timestamp'
            result:
              type: 'null'
            error:
              $ref: '#/components/schemas/SafeError'
    ProbeSucceededOperation:
      allOf:
        - $ref: '#/components/schemas/OperationCommon'
        - type: object
          properties:
            kind:
              const: probe
            status:
              const: succeeded
            finished_at:
              $ref: '#/components/schemas/Timestamp'
            result:
              $ref: '#/components/schemas/ProbeResult'
            error:
              type: 'null'
    ReloadSucceededOperation:
      allOf:
        - $ref: '#/components/schemas/OperationCommon'
        - type: object
          properties:
            kind:
              const: reload
            status:
              const: succeeded
            finished_at:
              $ref: '#/components/schemas/Timestamp'
            result:
              $ref: '#/components/schemas/ReloadResult'
            error:
              type: 'null'
    ReloadResult:
      type: object
      required:
        - active_generation_id
        - datapath_generation_id
      properties:
        active_generation_id:
          type:
            - string
            - 'null'
        datapath_generation_id:
          type:
            - string
            - 'null'
    SuspendSucceededOperation:
      allOf:
        - $ref: '#/components/schemas/OperationCommon'
        - type: object
          properties:
            kind:
              const: suspend
            status:
              const: succeeded
            finished_at:
              $ref: '#/components/schemas/Timestamp'
            result:
              type: object
              required:
                - runtime_state
              properties:
                runtime_state:
                  type:
                    - string
                    - 'null'
                  enum:
                    - suspended
                    - null
            error:
              type: 'null'
    ResumeSucceededOperation:
      allOf:
        - $ref: '#/components/schemas/OperationCommon'
        - type: object
          properties:
            kind:
              const: resume
            status:
              const: succeeded
            finished_at:
              $ref: '#/components/schemas/Timestamp'
            result:
              type: object
              required:
                - runtime_state
              properties:
                runtime_state:
                  type:
                    - string
                    - 'null'
                  enum:
                    - running
                    - null
            error:
              type: 'null'
    GroupUpdateSucceededOperation:
      allOf:
        - $ref: '#/components/schemas/OperationCommon'
        - type: object
          properties:
            kind:
              const: group_update
            status:
              const: succeeded
            finished_at:
              $ref: '#/components/schemas/Timestamp'
            result:
              $ref: '#/components/schemas/GroupUpdateResult'
            error:
              type: 'null'
    GroupUpdateResult:
      type: object
      required:
        - group_id
        - config_revision
      properties:
        group_id:
          type: string
          minLength: 1
        config_revision:
          type: string
          minLength: 1
    EventKind:
      type: string
      enum:
        - stream.ready
        - runtime.updated
        - flow.updated
        - flow.gap
        - operation.updated
        - generation.changed
    LogLevel:
      type: string
      enum:
        - trace
        - debug
        - info
        - warn
        - error
    LogRecord:
      type: object
      required:
        - ts
        - level
        - target
        - message
        - fields
      properties:
        ts:
          $ref: '#/components/schemas/Timestamp'
        level:
          $ref: '#/components/schemas/LogLevel'
        target:
          type: string
          minLength: 1
          description: Engine module name, not a network destination.
        message:
          type: string
          minLength: 1
          description: Sanitized operator message; no secrets or raw configuration.
        fields:
          type:
            - object
            - 'null'
          additionalProperties: true
          description: Sanitized structured fields, or null when unavailable; the message safety rules apply recursively.
    RuntimeSettingField:
      type: string
      enum:
        - log.level
        - log.buffered_records
        - dns_log.max_records
        - flows.max_flows
        - flows.retention_seconds
    RuntimeSettings:
      type: object
      required:
        - observed_at
        - source
        - log
        - dns_log
        - flows
      properties:
        observed_at:
          $ref: '#/components/schemas/Timestamp'
        source:
          type: string
          enum:
            - config
            - runtime
          description: config while every value comes from the activated configuration; runtime once any PATCH overrode one.
        log:
          type: object
          required:
            - level
            - buffered_records
          properties:
            level:
              $ref: '#/components/schemas/LogLevel'
              description: The minimum severity the engine emits; the stream's level filter cannot go below it.
            buffered_records:
              $ref: '#/components/schemas/SafeUInt'
              minimum: 64
              description: Log replay ring capacity, at most logs.max_buffered_records.
        dns_log:
          type: object
          required:
            - max_records
          properties:
            max_records:
              $ref: '#/components/schemas/SafeUInt'
              minimum: 64
              description: DNS log ring capacity, at most dns_log.max_records.
        flows:
          type: object
          required:
            - max_flows
            - retention_seconds
          properties:
            max_flows:
              $ref: '#/components/schemas/SafeUInt'
              minimum: 64
              description: Retained flows, at most flows.max_flows.
            retention_seconds:
              $ref: '#/components/schemas/SafeUInt'
              minimum: 1
              description: How long a terminal flow stays, at most flows.retention_seconds.
    RuntimeSettingsPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        log:
          type: object
          additionalProperties: false
          minProperties: 1
          properties:
            level:
              $ref: '#/components/schemas/LogLevel'
            buffered_records:
              $ref: '#/components/schemas/SafeUInt'
              minimum: 64
        dns_log:
          type: object
          additionalProperties: false
          minProperties: 1
          properties:
            max_records:
              $ref: '#/components/schemas/SafeUInt'
              minimum: 64
        flows:
          type: object
          additionalProperties: false
          minProperties: 1
          properties:
            max_flows:
              $ref: '#/components/schemas/SafeUInt'
              minimum: 64
            retention_seconds:
              $ref: '#/components/schemas/SafeUInt'
              minimum: 1
    StreamReadyEvent:
      type: object
      required:
        - instance_id
        - observed_at
      properties:
        instance_id:
          type: string
          minLength: 1
        observed_at:
          $ref: '#/components/schemas/Timestamp'
      not:
        anyOf:
          - required:
              - href
          - required:
              - resource_id
          - required:
              - revision
          - required:
              - status
          - required:
              - reason
          - required:
              - previous_generation_id
          - required:
              - generation_id
    RuntimeUpdatedEvent:
      type: object
      required:
        - instance_id
        - observed_at
        - href
      properties:
        instance_id:
          type: string
          minLength: 1
        observed_at:
          $ref: '#/components/schemas/Timestamp'
        href:
          const: /api/v1/runtime
    FlowUpdatedEvent:
      type: object
      required:
        - instance_id
        - observed_at
        - resource_id
        - revision
        - href
      properties:
        instance_id:
          type: string
          minLength: 1
        observed_at:
          $ref: '#/components/schemas/Timestamp'
        resource_id:
          type: string
          minLength: 1
        revision:
          type: integer
          minimum: 1
          maximum: 9007199254740991
        href:
          type: string
          pattern: ^/api/v1/flows/[^/]+$
    FlowGapEvent:
      type: object
      required:
        - instance_id
        - observed_at
        - resource_id
        - reason
        - dropped_records
      properties:
        instance_id:
          type: string
          minLength: 1
        observed_at:
          $ref: '#/components/schemas/Timestamp'
        resource_id:
          type:
            - string
            - 'null'
        reason:
          type: string
          enum:
            - buffer_overflow
            - sampled
            - evicted
            - recording_changed
        dropped_records:
          $ref: '#/components/schemas/NullableUInt64'
    OperationUpdatedEvent:
      type: object
      required:
        - instance_id
        - observed_at
        - resource_id
        - status
        - href
      properties:
        instance_id:
          type: string
          minLength: 1
        observed_at:
          $ref: '#/components/schemas/Timestamp'
        resource_id:
          type: string
          minLength: 1
        status:
          type: string
          enum:
            - queued
            - running
            - succeeded
            - failed
        href:
          type: string
          pattern: ^/api/v1/operations/[^/]+$
    GenerationChangedEvent:
      type: object
      required:
        - instance_id
        - observed_at
        - previous_generation_id
        - generation_id
      properties:
        instance_id:
          type: string
          minLength: 1
        observed_at:
          $ref: '#/components/schemas/Timestamp'
        previous_generation_id:
          type: string
          minLength: 1
        generation_id:
          type: string
          minLength: 1
    StepCommon:
      type: object
      required:
        - seq
        - observed_at
        - elapsed_us
        - generation_id
        - evidence
      properties:
        seq:
          type: integer
          minimum: 1
          maximum: 9007199254740991
        observed_at:
          $ref: '#/components/schemas/NullableTimestamp'
        elapsed_us:
          $ref: '#/components/schemas/NullableSafeUInt'
        generation_id:
          type:
            - string
            - 'null'
        evidence:
          type: string
          enum:
            - observed
            - reconstructed
    OperationCommon:
      type: object
      required:
        - operation_id
        - kind
        - status
        - created_at
        - started_at
        - finished_at
        - result
        - error
      properties:
        operation_id:
          type: string
          minLength: 1
        kind:
          $ref: '#/components/schemas/OperationKind'
        status:
          type: string
          enum:
            - queued
            - running
            - succeeded
            - failed
        created_at:
          $ref: '#/components/schemas/Timestamp'
        started_at:
          $ref: '#/components/schemas/NullableTimestamp'
        finished_at:
          $ref: '#/components/schemas/NullableTimestamp'
        result:
          type:
            - object
            - 'null'
          additionalProperties: true
        error:
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/SafeError'
  examples:
    FlowUpdated:
      summary: Flow revision notification
      x-event: flow.updated
      x-event-id: instance-7:124
      value:
        instance_id: instance-7
        observed_at: '2026-09-14T10:00:00Z'
        resource_id: flow-23
        revision: 8
        href: /api/v1/flows/flow-23
