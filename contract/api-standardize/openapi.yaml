  /api/v1/rules:
    get:
      operationId: listRules
      summary: Read the running generation's routing rules
      description: |
        Return one coherent, complete rule dictionary for the running routing generation,
        in evaluation order, including its fallback entry. This resource is read-only;
        it neither evaluates traffic nor reads back raw configuration. rule_id is identical
        to the ID used by POST /api/v1/routing/trace and FlowSummary.rule_id for the same
        generation. Join rules by generation_id and rule_id, never by expression or
        index alone. FlowSummary does not carry the rule's generation; obtain it from
        the corresponding traffic-route step in the retained flow detail. If that
        context is unavailable, do not join the summary to the current rule dictionary.
        generation_id identifies the dictionary's routing generation. Refetch after
        generation.changed; do not join old flow evidence to a new generation.
        There is no paginated snapshot and no 410 snapshot_expired response. If a coherent
        generation cannot be pinned, return 503 snapshot_unavailable. If the complete
        dictionary exceeds resources.rules.max_rules, return 503 temporarily_unavailable
        rather than silently truncate it. Redact local paths and secret-bearing expression
        values without changing rule identities or order; never expose raw configuration.
      x-permission: observe
      security:
        - bearerAuth: []
        - {}
      responses:
        '200':
          description: Ordered rules and fallback from one running generation
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            X-Content-Type-Options:
              $ref: '#/components/headers/NoSniff'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuleList'
              examples:
                running:
                  value:
                    generation_id: generation-42
                    rules:
                      - rule_id: traffic:0
                        index: 0
                        expression: pname(curl) -> direct
                        outbound: direct
                        must: false
                        source:
                          file: '[redacted]/routing.dae'
                          source_id: source-routing
                          line: 12
                          column: 5
                        kind: rule
                      - rule_id: traffic:1
                        index: 1
                        expression: dip(198.51.100.0/24) -> proxy
                        outbound: proxy
                        must: false
                        source:
                          file: '[redacted]/routing.dae'
                          source_id: source-routing
                          line: 13
                          column: 5
                        kind: rule
                      - rule_id: traffic:2
                        index: 2
                        expression: 'fallback: block'
                        outbound: block
                        must: false
                        source: null
                        kind: fallback
                    fallback:
                      outbound: block
                      source: null
                  x-headers:
                    Content-Type: application/json
                    Cache-Control: no-store
                    X-Content-Type-Options: nosniff
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          description: The dictionary exceeds max_rules (temporarily_unavailable), or a coherent generation could not be pinned (snapshot_unavailable)
          headers:
            Retry-After:
              description: Retry delay in seconds.
              required: true
              schema:
                type: integer
                minimum: 1
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            X-Content-Type-Options:
              $ref: '#/components/headers/NoSniff'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                temporarily_unavailable:
                  value:
                    error:
                      code: temporarily_unavailable
                      message: The rule dictionary exceeds resources.rules.max_rules.
                      details: null
                    request_id: request-01HZX4K8W6
                  x-headers:
                    Content-Type: application/json
                    Retry-After: 1
                    Cache-Control: no-store
                    X-Content-Type-Options: nosniff
                snapshot_unavailable:
                  value:
                    error:
                      code: snapshot_unavailable
                      message: A coherent routing generation is unavailable; retry the read.
                      details: null
                    request_id: request-01HZX4K8W6
                  x-headers:
                    Content-Type: application/json
                    Retry-After: 1
                    Cache-Control: no-store
                    X-Content-Type-Options: nosniff
  /api/v1/events:
    get:
      operationId: streamEvents
      summary: Follow bounded resumable invalidation events
      description: |
        Send stream.ready first on every connection, including a valid resume.
        Its cursor must not skip pending replay; retain the supplied Last-Event-ID
        until replay advances it. Filtered-out IDs may leave gaps, so clients must
        not infer loss by subtracting IDs.
      x-permission: observe
      security:
        - bearerAuth: []
        - {}
      parameters:
        - name: kinds
          in: query
          description: Comma-separated advertised event kinds.
          schema:
            type: string
            minLength: 1
          example: flow.updated,flow.gap
        - name: flow_id
          in: query
          schema:
            type: string
            minLength: 1
        - $ref: '#/components/parameters/LastEventId'
      responses:
        '200':
          description: Server-sent events; validate data using the schema selected by the event name.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            X-Content-Type-Options:
              $ref: '#/components/headers/NoSniff'
          content:
            text/event-stream:
              schema:
                type: string
              x-event-data-schemas:
                stream.ready: '#/components/schemas/StreamReadyEvent'
                runtime.updated: '#/components/schemas/RuntimeUpdatedEvent'
                flow.updated: '#/components/schemas/FlowUpdatedEvent'
                flow.gap: '#/components/schemas/FlowGapEvent'
                operation.updated: '#/components/schemas/OperationUpdatedEvent'
                generation.changed: '#/components/schemas/GenerationChangedEvent'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/EventCursorExpired'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/v1/logs:
    get:
      operationId: streamLogs
      summary: Follow bounded resumable engine logs
      description: |
        Requires resources.logs.available. Emit stream.ready first on every connection,
        using the shared StreamReadyEvent payload and an opaque replay cursor. On a
        valid resume, deliver retained matching records strictly after Last-Event-ID,
        then live records without an unobserved gap. The ready cursor must not skip
        pending replay; retain the supplied cursor until replay advances it.
        Each log frame carries an opaque id unique within the running instance.
        Duplicate delivery is permitted; deduplicate by id, never by message or ts.
        Cursors are bound to this stream, instance and filters. Unknown, expired,
        previous-instance or changed-filter cursors return 409 event_cursor_expired
        before opening the stream. Drop the cursor and reconnect to establish a new
        baseline; lost history is not recovered. Filtered-out IDs may leave gaps.
        Retain at most resources.logs.max_buffered_records records, none older than
        resources.logs.retention_seconds; this is not durable storage.
        Close slow clients when their bounded queue fills; never block engine writers.
        Send heartbeat comments at most 15 seconds apart while idle. Recheck credentials
        on reconnect and terminate streams when authorization is revoked.
        Sanitize messages and fields before buffering: no secrets, credentials, raw
        configuration, stack traces or unredacted local paths. Never forward raw engine output.
      x-permission: observe
      security:
        - bearerAuth: []
        - {}
      parameters:
        - name: level
          in: query
          description: Minimum severity, ordered trace < debug < info < warn < error. Omit for all advertised levels; an unadvertised level returns 400 invalid_request.
          schema:
            $ref: '#/components/schemas/LogLevel'
          example: info
        - name: target
          in: query
          description: Case-sensitive literal module prefix; omit for all targets.
          schema:
            type: string
            minLength: 1
          example: honk::routing
        - $ref: '#/components/parameters/LastEventId'
      responses:
        '200':
          description: Log stream; stream.ready precedes replay and live log frames. Heartbeat comments have no id or data.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            X-Content-Type-Options:
              $ref: '#/components/headers/NoSniff'
          content:
            text/event-stream:
              schema:
                type: string
              x-event-data-schemas:
                stream.ready: '#/components/schemas/StreamReadyEvent'
                log: '#/components/schemas/LogRecord'
              examples:
                records:
                  value: |
                    id: instance-7:logs:123
                    event: stream.ready
                    data: {"instance_id":"instance-7","observed_at":"2026-09-14T10:00:00Z"}

                    id: instance-7:logs:124
                    event: log
                    data: {"ts":"2026-09-14T10:00:01Z","level":"info","target":"honk::routing","message":"Routing generation published.","fields":{"generation_id":"generation-42"}}

                    : heartbeat
                  x-headers:
                    Content-Type: text/event-stream
                    Cache-Control: no-store
                    X-Content-Type-Options: nosniff
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/EventCursorExpired'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/v1/runtime/settings:
    get:
      operationId: getRuntimeSettings
      summary: Read the runtime-adjustable settings
      description: |
        Requires resources.runtime_settings.available. Returns the current
        runtime-adjustable settings. Numeric values cannot exceed their corresponding
        capability ceilings. source is config when values come from the activated
        configuration and runtime after a runtime override. geodata appears when
        resources.geodata.configurable_sources is true and carries its own source.
        GET needs only observe, so geodata URLs are returned as written only to an
        authenticated caller with control, which may edit them, and redacted like
        GeoAsset.source_redacted for everyone else.
      x-permission: observe
      security:
        - bearerAuth: []
        - {}
      responses:
        '200':
          description: Current runtime settings
          headers:
