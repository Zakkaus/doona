openapi: 3.1.0
info:
  title: dae/honk Native API
  version: 0.1.0-draft
  description: |
    Normative wire contract for the native control-plane API. Unknown response
    extension fields are permitted. Request objects reject unknown fields.
    Published as a generated bundle at source/openapi.yaml; edit the api/ sources,
    not the published file.
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
servers:
  - url: http://localhost:9527
security: []
paths:
  /api:
    get:
      operationId: getDiscovery
      summary: Discover the native API
      security: []
      responses:
        '200':
          description: Native API discovery
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            X-Content-Type-Options:
              $ref: '#/components/headers/NoSniff'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Discovery'
              examples:
                draft:
                  value:
                    name: dae/honk-native
                    status: draft
                    api_major: 1
                    base_path: /api/v1
                    links:
                      version: /api/v1/version
                      capabilities: /api/v1/capabilities
                      config: /api/v1/config
                      config_validate: /api/v1/config/validate
                      runtime: /api/v1/runtime
                      runtime_outbounds: /api/v1/runtime/outbounds
                      traffic_history: /api/v1/runtime/traffic/history
                      memory_history: /api/v1/runtime/memory/history
                      logs: /api/v1/logs
                      providers: /api/v1/providers
                      rules: /api/v1/rules
                      runtime_mode: /api/v1/runtime/mode
                      operations: /api/v1/operations/{id}
                  x-headers:
                    Content-Type: application/json
                    Cache-Control: no-store
                    X-Content-Type-Options: nosniff
        '400':
          $ref: '#/components/responses/BadRequest'
  /api/v1/version:
    get:
      operationId: getVersion
      summary: Read native and engine version identity
      security: []
      responses:
        '200':
          description: Version identity
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            X-Content-Type-Options:
              $ref: '#/components/headers/NoSniff'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Version'
              examples:
                build:
                  value:
                    api:
                      name: dae/honk-native
                      major: 1
                      status: draft
                    engine:
                      name: honk
                      version: 0.0.1-alpha
                    build:
                      revision: abc1234
                      target: x86_64-unknown-linux-gnu
                      built_at: null
                  x-headers:
                    Content-Type: application/json
                    Cache-Control: no-store
                    X-Content-Type-Options: nosniff
  /api/v1/capabilities:
