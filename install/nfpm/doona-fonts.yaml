# The optional Noto Sans TC/SC subset staged from the prebuilt fonts archive.
# PACKAGE_SUFFIX follows doona.yaml: -web for the deb, unset for the other formats.
name: doona${PACKAGE_SUFFIX}-fonts
arch: all
platform: linux
version: ${VERSION}
prerelease: ${PRERELEASE}
release: ${PACKAGE_RELEASE}
version_schema: semver
section: fonts
priority: optional
maintainer: Zakkaus <zakk@gentoozh.org>
vendor: Zakkaus
homepage: https://github.com/Zakkaus/doona
license: OFL-1.1
description: |
  Noto Sans TC and SC for doona
  Without this package the browser falls back to its own fonts.
depends:
  - doona${PACKAGE_SUFFIX}
deb:
  breaks:
    - doona-fonts (<< 1.0)
overrides:
  deb:
    replaces:
      - doona-fonts (<< 1.0)
    conflicts:
      - doona-fonts (<< 1.0)
    contents:
      - src: build/stage/doona-fonts/usr/share/doona/fonts
        dst: /usr/share/doona-web/fonts
        type: tree
      - src: build/stage/doona-fonts/usr/share/doc/doona/OFL.txt
        dst: /usr/share/doc/doona-web/OFL.txt
contents:
  - src: build/stage/doona-fonts/usr/share/doona/fonts
    dst: /usr/share/doona/fonts
    type: tree
  - src: build/stage/doona-fonts/usr/share/doc/doona/OFL.txt
    dst: /usr/share/doc/doona/OFL.txt
    type: license
    packager: rpm
  - src: build/stage/doona-fonts/usr/share/doc/doona/OFL.txt
    dst: /usr/share/doc/doona/OFL.txt
    packager: ipk
  - src: build/stage/doona-fonts/usr/share/doc/doona/OFL.txt
    dst: /usr/share/doc/doona/OFL.txt
    packager: archlinux
