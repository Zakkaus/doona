version = 1

[[annotations]]
path = [
  "*",
  ".github/**",
  "src/**",
  "e2e/**",
  "tools/**",
  "install/**",
  "docs/**",
  "contract/**",
  "public/**",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "doona contributors"
SPDX-License-Identifier = "GPL-3.0-only"

# Noto Sans TC and SC, whose name tables carry Adobe's copyright.
[[annotations]]
path = ["public/fonts/**"]
precedence = "override"
SPDX-FileCopyrightText = "2014-2021 Adobe"
SPDX-License-Identifier = "OFL-1.1"

[[annotations]]
path = ["src/ui/icons/**"]
precedence = "override"
SPDX-FileCopyrightText = "2024 Adobe. All rights reserved."
SPDX-License-Identifier = "Apache-2.0"

# The GitHub mark is GitHub's, used as its logo terms allow; it is not an Adobe icon.
[[annotations]]
path = ["src/ui/icons/GitHub.tsx"]
precedence = "override"
SPDX-FileCopyrightText = "GitHub, Inc."
SPDX-License-Identifier = "LicenseRef-GitHub-Logos"

# Drawn for doona on the Spectrum grid, not copied from Adobe.
[[annotations]]
path = ["src/ui/icons/MoreVertical.tsx", "src/ui/icons/MoreHorizontal.tsx", "src/ui/icons/Settings.tsx"]
precedence = "override"
SPDX-FileCopyrightText = "doona contributors"
SPDX-License-Identifier = "GPL-3.0-only"

[[annotations]]
path = [".github/CODE_OF_CONDUCT.md"]
precedence = "override"
SPDX-FileCopyrightText = "NOASSERTION"
SPDX-License-Identifier = "CC-BY-4.0"

# Ebuilds carry the header the overlays require.
[[annotations]]
path = ["install/gentoo/**"]
precedence = "override"
SPDX-FileCopyrightText = "2026 Gentoo Authors"
SPDX-License-Identifier = "GPL-2.0-only"

# j4p4n's Openclipart drawing is in the public domain; the crop and tint are dedicated to it as well.
[[annotations]]
path = ["src/ui/styles/palettes/qiangguo/wall-*.webp"]
precedence = "override"
SPDX-FileCopyrightText = "NOASSERTION"
SPDX-License-Identifier = "CC0-1.0"

# Stéphane Passet's 1913 autochrome of Mount Tai's South Gate of Heaven is released under CC0 by the Musée
# Albert-Kahn; the strokes and tint are dedicated to it as well.
[[annotations]]
path = ["src/ui/styles/palettes/qiangguo/taishan-*.webp"]
precedence = "override"
SPDX-FileCopyrightText = "NOASSERTION"
SPDX-License-Identifier = "CC0-1.0"

# Kuimen is cut from Tan Wei Liang Byorn's CC BY 3.0 photograph. Sources are listed in NOTICE.
[[annotations]]
path = ["src/ui/styles/palettes/qiangguo/gorges-*.webp"]
precedence = "override"
SPDX-FileCopyrightText = ["Tan Wei Liang Byorn", "doona contributors"]
SPDX-License-Identifier = "CC-BY-3.0"

# Sun Moon Lake is cut from two of Bernard Gagnon's CC BY-SA 3.0 photographs; CC BY-SA 3.0 allows adaptations under
# a later version, so the combined images carry CC BY-SA 4.0. Sources are listed in NOTICE.
[[annotations]]
path = ["src/ui/styles/palettes/qiangguo/lake-*.webp"]
precedence = "override"
SPDX-FileCopyrightText = ["Bernard Gagnon", "doona contributors"]
SPDX-License-Identifier = "CC-BY-SA-4.0"

# The square is cut from Balon Greyjoy's CC0 photographs and Another Believer's CC BY-SA 4.0 photograph, so the
# combined images carry CC BY-SA 4.0. Sources are listed in NOTICE.
[[annotations]]
path = ["src/ui/styles/palettes/qiangguo/square-*.webp"]
precedence = "override"
SPDX-FileCopyrightText = ["Balon Greyjoy", "Another Believer", "doona contributors"]
SPDX-License-Identifier = "CC-BY-SA-4.0"

# The five stars follow the public-domain flag geometry.
[[annotations]]
path = ["src/ui/styles/palettes/qiangguo/flag-*.svg"]
precedence = "override"
SPDX-FileCopyrightText = "NOASSERTION"
SPDX-License-Identifier = "CC0-1.0"

[[annotations]]
path = ["src/ui/assets/TwemojiCountryFlags.woff2"]
precedence = "override"
SPDX-FileCopyrightText = ["Twitter and other contributors", "2016-2018 Mozilla Foundation"]
SPDX-License-Identifier = "CC-BY-4.0"
