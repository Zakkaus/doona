version = 1

[[annotations]]
path = [
  "*",
  ".github/**",
  "src/**",
  "e2e/**",
  "tools/**",
  "install/**",
  "docs/**",
  "contract/**",
  "public/**",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "doona contributors"
SPDX-License-Identifier = "GPL-3.0-only"

# The bundled OFL notice does not identify the font copyright holder.
[[annotations]]
path = ["public/fonts/**"]
precedence = "override"
SPDX-FileCopyrightText = "NOASSERTION"
SPDX-License-Identifier = "OFL-1.1"

[[annotations]]
path = ["src/ui/icons/**"]
precedence = "override"
SPDX-FileCopyrightText = "2024 Adobe. All rights reserved."
SPDX-License-Identifier = "Apache-2.0"

# The GitHub mark is GitHub's, used as its logo terms allow; it is not an Adobe icon.
[[annotations]]
path = ["src/ui/icons/GitHub.tsx"]
precedence = "override"
SPDX-FileCopyrightText = "GitHub, Inc."
SPDX-License-Identifier = "LicenseRef-GitHub-Logos"

# Drawn for doona on the Spectrum grid, not copied from Adobe.
[[annotations]]
path = ["src/ui/icons/MoreVertical.tsx", "src/ui/icons/Settings.tsx"]
precedence = "override"
SPDX-FileCopyrightText = "doona contributors"
SPDX-License-Identifier = "GPL-3.0-only"

[[annotations]]
path = [".github/CODE_OF_CONDUCT.md"]
precedence = "override"
SPDX-FileCopyrightText = "NOASSERTION"
SPDX-License-Identifier = "CC-BY-4.0"

# Ebuilds carry the header the overlays require.
[[annotations]]
path = ["install/gentoo/**"]
precedence = "override"
SPDX-FileCopyrightText = "2026 Gentoo Authors"
SPDX-License-Identifier = "GPL-2.0-only"
