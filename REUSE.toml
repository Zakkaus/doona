version = 1

[[annotations]]
path = [
  "*",
  ".github/**",
  "src/**",
  "e2e/**",
  "tools/**",
  "install/**",
  "docs/**",
  "contract/**",
  "public/**",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "doona contributors"
SPDX-License-Identifier = "GPL-3.0-only"

# The bundled OFL notice does not identify the font copyright holder.
[[annotations]]
path = ["public/fonts/**"]
precedence = "override"
SPDX-FileCopyrightText = "NOASSERTION"
SPDX-License-Identifier = "OFL-1.1"

[[annotations]]
path = ["src/ui/icons/**"]
precedence = "override"
SPDX-FileCopyrightText = "2024 Adobe. All rights reserved."
SPDX-License-Identifier = "Apache-2.0"

# Flag.tsx imports artwork from the MIT-licensed flag-icons dependency;
# the SVGs are not stored in that source file. NOTICE retains their attribution.

[[annotations]]
path = ["CODE_OF_CONDUCT.md"]
precedence = "override"
SPDX-FileCopyrightText = "NOASSERTION"
SPDX-License-Identifier = "CC-BY-4.0"
