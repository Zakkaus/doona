<!doctype html>
<html lang="zh-Hant">
<meta charset="utf-8">
<title>doona · Radix Themes</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://esm.sh/@radix-ui/themes@3.2.1/styles.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+TC:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  /* Only layout that the library does not own. Everything else comes from Radix Themes tokens. */
  html, body { height: 100%; margin: 0; }
  .radix-themes { --default-font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang TC", "IBM Plex Sans TC", system-ui, sans-serif; --code-font-family: ui-monospace, "SF Mono", "IBM Plex Mono", Menlo, monospace; }
  .win { display: grid; grid-template-columns: 208px 1fr; height: 100vh; }
  .side { border-right: 1px solid var(--gray-a5); background: var(--color-panel-translucent); backdrop-filter: blur(24px); display: flex; flex-direction: column; }
  .nav a { display: flex; align-items: center; gap: var(--space-2); height: 32px; padding: 0 var(--space-3); border-radius: var(--radius-2); color: var(--gray-12); text-decoration: none; font-size: var(--font-size-2); }
  .nav a:hover { background: var(--gray-a3); }
  .nav a[aria-current] { background: var(--gray-a4); font-weight: 500; }
  .nav a[aria-current] svg { color: var(--accent-9); }
  .nav svg { width: 16px; height: 16px; color: var(--gray-11); }
  .content { min-width: 0; display: flex; flex-direction: column; overflow: hidden; }
  .page { flex: 1; overflow: auto; }
  .row-sel { background: var(--accent-a3) !important; }
  .rt-TableRow { cursor: pointer; }
  .rt-TableRow:hover { background: var(--gray-a2); }
  .node[data-sel="true"] { background: var(--accent-9); color: var(--accent-contrast); }
  .node[data-sel="true"] * { color: inherit !important; }
  .node { cursor: pointer; }
  .node[data-dis="true"] { cursor: default; opacity: 0.85; }
  .spark { width: 100%; height: 56px; display: block; margin-top: auto; }
  .code { font-family: var(--code-font-family); font-size: var(--font-size-1); line-height: 22px; }
  .ln { display: grid; grid-template-columns: 44px 1fr; white-space: pre; }
  .ln > span:first-child { color: var(--gray-9); text-align: right; padding-right: var(--space-3); user-select: none; }
  .ln.new { background: var(--accent-a3); } .ln.err { background: var(--red-a3); }
</style>
<body>
<div id="root"></div>
<script type="importmap">
{ "imports": {
  "react": "https://esm.sh/react@18.3.1",
  "react-dom/client": "https://esm.sh/react-dom@18.3.1/client?deps=react@18.3.1",
  "htm": "https://esm.sh/htm@3.1.1",
  "@radix-ui/themes": "https://esm.sh/@radix-ui/themes@3.2.1?deps=react@18.3.1,react-dom@18.3.1",
  "lucide-react": "https://esm.sh/lucide-react@0.468.0?deps=react@18.3.1"
} }
</script>
<script type="module">
import React, { useState, useEffect } from 'react';
import { createRoot } from 'react-dom/client';
import htm from 'htm';
import * as R from '@radix-ui/themes';
import { Activity, LayoutGrid, ArrowRightLeft, MonitorSmartphone, GitFork, List, Globe, Package, FileText, History, RefreshCw, Search, Sun, Moon, Monitor, Plus, Stethoscope, X } from 'lucide-react';

const h = htm.bind(React.createElement);
const { Theme, Box, Flex, Grid, Card, Heading, Text, Badge, Button, IconButton, SegmentedControl, Switch, Table, Dialog, Select, TextField, Separator, Callout, Tooltip, DataList, Progress, Code, Kbd, Link, Inset } = R;

const NAV = [
  [null, [['activity', '活動', Activity], ['overview', '概覽', LayoutGrid]]],
  ['網路', [['conns', '連線', ArrowRightLeft], ['clients', '客戶端', MonitorSmartphone]]],
  ['代理', [['policies', '策略', GitFork], ['rules', '規則', List], ['dns', 'DNS', Globe]]],
  ['系統', [['resources', '資源', Package], ['config', '配置', FileText], ['events', '事件', History]]],
];

const Dot = ({ kind }) => h`<${Box} width="7px" height="7px" style=${{ borderRadius: '50%', background: kind === 'ok' ? 'var(--green-9)' : kind === 'warn' ? 'var(--amber-9)' : kind === 'bad' ? 'var(--red-9)' : 'var(--gray-8)', flex: 'none' }} />`;
const St = ({ kind, children }) => h`<${Flex} align="center" gap="2"><${Dot} kind=${kind} /><${Text} size="1" color=${kind === 'bad' ? undefined : 'gray'}>${children}<//><//>`;
const Label = ({ children }) => h`<${Text} size="1" color="gray">${children}<//>`;
const Big = ({ v, u }) => h`<${Flex} align="baseline" gap="1"><${Text} size="8" weight="bold" style=${{ letterSpacing: '-0.02em' }}>${v}<//><${Text} size="1" color="gray">${u}<//><//>`;

function Spark({ pts, color }) {
  const d = pts.map(([x, y], i) => (i ? 'L' : 'M') + x + ' ' + y).join(' ');
  return h`<svg class="spark" viewBox="0 0 200 46" preserveAspectRatio="none" aria-hidden="true">
    <path d=${d + ' L200 46 L0 46 Z'} fill=${color} opacity="0.12" />
    <path d=${d} fill="none" stroke=${color} stroke-width="1.5" />
    <circle cx=${pts[pts.length - 1][0]} cy=${pts[pts.length - 1][1]} r="2.5" fill=${color} />
  </svg>`;
}
const UP = [[0,40],[20,34],[40,36],[60,22],[80,26],[100,18],[120,24],[140,12],[160,20],[180,16],[200,14]];
const DN = [[0,38],[20,30],[40,32],[60,14],[80,20],[100,10],[120,18],[140,8],[160,16],[180,12],[200,10]];

function useToast() {
  const [items, set] = useState([]);
  const push = (kind, msg) => { const id = Date.now() + Math.random(); set(s => [...s, { id, kind, msg }]); setTimeout(() => set(s => s.filter(t => t.id !== id)), 4000); };
  const view = h`<${Flex} direction="column" gap="2" style=${{ position: 'fixed', right: 24, bottom: 24, zIndex: 50 }}>
    ${items.map(t => h`<${Card} key=${t.id} size="1" variant="classic"><${Flex} align="center" gap="3"><${St} kind=${t.kind}><${Text} size="2" color="gray" style=${{ color: 'var(--gray-12)' }}>${t.msg}<//><//><${IconButton} size="1" variant="ghost" color="gray" onClick=${() => set(s => s.filter(x => x.id !== t.id))}><${X} size="14" /><//><//><//>`)}
  <//>`;
  return [push, view];
}

function RuleDialog({ open, onOpenChange, seed, onDone }) {
  const [cond, setCond] = useState(seed);
  const [out, setOut] = useState('direct');
  const [must, setMust] = useState(false);
  useEffect(() => setCond(seed), [seed]);
  const line = `${cond} -> ${out}${must ? '(must)' : ''}`;
  return h`<${Dialog.Root} open=${open} onOpenChange=${onOpenChange}>
    <${Dialog.Content} maxWidth="460px">
      <${Dialog.Title}>加規則<//>
      <${Dialog.Description} size="2" color="gray">寫進 config.dae，校驗通過後 reload。<//>
      <${Flex} direction="column" gap="3" mt="4">
        <${Grid} columns="72px 1fr" align="center" gap="3">
          <${Label}>條件<//><${TextField.Root} value=${cond} onChange=${e => setCond(e.target.value)} style=${{ fontFamily: 'var(--code-font-family)' }} />
          <${Label}>出站<//><${Select.Root} value=${out} onValueChange=${setOut}><${Select.Trigger} /><${Select.Content}>${['direct','proxy','block','resilient'].map(o => h`<${Select.Item} key=${o} value=${o}>${o}<//>`)}<//><//>
          <${Label}>must<//><${Box}><${Switch} checked=${must} onCheckedChange=${setMust} /><//>
          <${Label}>位置<//><${Select.Root} defaultValue="fb"><${Select.Trigger} /><${Select.Content}><${Select.Item} value="fb">fallback 之前（第 44 行）<//><${Select.Item} value="hit">命中的 #4 之前（第 41 行）<//><${Select.Item} value="top">最前面（第 38 行）<//><//><//>
        <//>
        <${Code} size="2" variant="soft" style=${{ padding: 'var(--space-2) var(--space-3)', display: 'block' }}>${line}<//>
        <${St} kind="">第 40 行 geosite: cn 可能先命中<//>
      <//>
      <${Flex} gap="2" mt="4" justify="end">
        <${Dialog.Close}><${Button} variant="soft" color="gray">取消<//><//>
        <${Dialog.Close}><${Button} onClick=${() => onDone(line)}>加入並 reload<//><//>
      <//>
    <//>
  <//>`;
}

function Shell() {
  const [page, setPage] = useState(location.hash.slice(1) || 'activity');
  const [appearance, setAppearance] = useState(() => { try { return localStorage.getItem('doona-rx') || 'inherit'; } catch (e) { return 'inherit'; } });
  useEffect(() => { try { localStorage.setItem('doona-rx', appearance); } catch (e) {} }, [appearance]);
  const go = k => { setPage(k); history.replaceState(null, '', '#' + k); };
  const [toast, toasts] = useToast();
  const [dlg, setDlg] = useState({ open: false, seed: '' });
  const openRule = seed => setDlg({ open: true, seed });
  const ctx = { toast, openRule, go };
  const Page = PAGES[page] || PAGES.activity;
  return h`<${Theme} appearance=${appearance} accentColor="blue" grayColor="slate" radius="medium" scaling="95%" panelBackground="translucent">
    <div class="win">
      <nav class="side">
        <${Flex} direction="column" gap="1" p="3" className="nav" style=${{ flex: 1 }}>
          ${NAV.map(([grp, items]) => h`<${React.Fragment} key=${grp || 'top'}>
            ${grp && h`<${Text} size="1" color="gray" weight="medium" mt="3" mb="1" ml="3">${grp}<//>`}
            ${items.map(([k, label, Icon]) => h`<a key=${k} href=${'#' + k} aria-current=${page === k ? 'page' : undefined} onClick=${e => { e.preventDefault(); go(k); }}><${Icon} />${label}</a>`)}
          <//>`)}
        <//>
        <${Separator} size="4" />
        <${Flex} align="center" gap="2" p="3"><${Dot} kind="ok" /><${Text} size="1" color="gray">gw.lan · honk 0.0.1-alpha<//><//>
      </nav>
      <div class="content">
        <${Flex} align="center" justify="between" px="5" py="3" gap="3">
          <${Badge} color="amber" variant="soft" size="2"><${Dot} kind="warn" />nfqueue 未就緒 · nfnetlink_queue 未載入 <${Link} size="1" href="#overview" onClick=${e => { e.preventDefault(); go('overview'); }}>看檢查<//><//>
          <${Flex} align="center" gap="3">
            <${TextField.Root} placeholder="搜尋連線、節點、規則" size="2" style=${{ width: 240 }}><${TextField.Slot}><${Search} size="14" /><//><//>
            <${SegmentedControl.Root} size="1" value=${appearance} onValueChange=${setAppearance}>
              <${SegmentedControl.Item} value="inherit"><${Monitor} size="14" /><//>
              <${SegmentedControl.Item} value="light"><${Sun} size="14" /><//>
              <${SegmentedControl.Item} value="dark"><${Moon} size="14" /><//>
            <//>
          <//>
        <//>
        <div class="page"><${Box} px="5" pb="6"><${Page} ...${ctx} /><//></div>
      </div>
    </div>
    <${RuleDialog} open=${dlg.open} seed=${dlg.seed} onOpenChange=${o => setDlg(d => ({ ...d, open: o }))} onDone=${line => toast('ok', '已加入 · ' + line + ' · 已 reload · r42')} />
    ${toasts}
  <//>`;
}

const Facts = ({ items }) => h`<${Flex} gap="7" wrap="wrap">${items.map(([k, v]) => h`<${Box} key=${k}><${Label}>${k}<//><${Text} as="div" size="3" weight="medium">${v}<//><//>`)}<//>`;
const H = ({ children, sub }) => h`<${Box} mb="4"><${Heading} size="8" weight="bold" style=${{ letterSpacing: '-0.02em' }}>${children}<//>${sub && h`<${Text} as="p" size="2" color="gray" mt="1">${sub}<//>`}<//>`;

const PAGES = {
  activity: ({ toast, go }) => h`<${Box}>
    <${H}>活動<//>
    <${Facts} items=${[['配置', '/etc/honk/config.dae'], ['出站模式', '規則 · Global → proxy'], ['datapath', 'eBPF · wan0 · lan0'], ['執行', '3 天 4 小時']]} />
    <${Grid} columns="3" gap="3" mt="4">
      <${Card} size="3"><${Flex} direction="column" gap="3" height="100%">
        <${Flex} justify="between" align="center"><${Label}>探測 · 經 proxy → hk-01<//><${Button} size="1" variant="ghost" onClick=${() => toast('ok', '探測完成 · TCP 39 ms · HTTP 121 ms · UDP DNS 9 ms')}><${RefreshCw} size="14" />重測<//><//>
        <${Big} v="126" u="ms" />
        <${Grid} columns="3" gap="3"><${Box}><${Label}>TCP 連線<//><${Text} as="div" size="3" weight="medium">41 ms<//><//><${Box}><${Label}>HTTP<//><${Text} as="div" size="3" weight="medium">126 ms<//><//><${Box}><${Label}>UDP DNS<//><${Text} as="div" size="3" weight="medium">9 ms<//><//><//>
        <${Text} size="1" color="gray">IPv4 · 目標來自 tcp_check_url 與 udp_check_dns<//>
      <//><//>
      <${Card} size="3"><${Flex} direction="column" gap="3" height="100%"><${Flex} justify="between"><${Label}>上傳<//><${St} kind="ok">wan0<//><//><${Big} v="312" u="KB/s" /><${Spark} pts=${UP} color="var(--accent-9)" /><//><//>
      <${Card} size="3"><${Flex} direction="column" gap="3" height="100%"><${Flex} justify="between"><${Label}>下載<//><${St} kind="ok">wan0<//><//><${Big} v="4.8" u="MB/s" /><${Spark} pts=${DN} color="var(--sky-9)" /><//><//>
    <//>
    <${Grid} columns="2" gap="3" mt="3">
      <${Card} size="3"><${Flex} direction="column" gap="3">
        <${Flex} justify="between" align="center"><${Label}>流量 · 本次觀察 12 分鐘<//><${SegmentedControl.Root} size="1" defaultValue="all"><${SegmentedControl.Item} value="all">全部<//><${SegmentedControl.Item} value="proxy">僅代理<//><//><//>
        <${Spark} pts=${DN} color="var(--sky-9)" /><${Spark} pts=${UP} color="var(--accent-9)" />
        <${Flex} gap="4"><${Text} size="1" color="gray">— 上傳<//><${Text} size="1" color="gray">— 下載<//><//>
      <//><//>
      <${Card} size="3"><${Flex} direction="column" gap="3">
        <${Flex} justify="between" align="center"><${Label}>活動連線<//><${Link} size="2" href="#conns" onClick=${e => { e.preventDefault(); go('conns'); }}>全部 47<//><//>
        <${Grid} columns="3" gap="3"><${Box}><${Label}>內核<//><${Text} as="div" size="5" weight="medium">39<//><//><${Box}><${Label}>userspace<//><${Text} as="div" size="5" weight="medium">8<//><//><${Box}><${Label}>客戶端<//><${Text} as="div" size="5" weight="medium">6<//><//><//>
        <${Flex} justify="between" align="center"><${Label}>按出站<//><${SegmentedControl.Root} size="1" defaultValue="out"><${SegmentedControl.Item} value="out">出站<//><${SegmentedControl.Item} value="cli">客戶端<//><${SegmentedControl.Item} value="dom">域名<//><//><//>
        <${DataList.Root} size="1">
          <${DataList.Item}><${DataList.Label} minWidth="110px">proxy → hk-01<//><${DataList.Value}><${Progress} value=${61} size="1" style=${{ width: '100%' }} /><//><//>
          <${DataList.Item}><${DataList.Label} minWidth="110px">direct<//><${DataList.Value}><${Progress} value=${35} size="1" color="gray" style=${{ width: '100%' }} /><//><//>
          <${DataList.Item}><${DataList.Label} minWidth="110px">block<//><${DataList.Value}><${Progress} value=${4} size="1" color="red" style=${{ width: '100%' }} /><//><//>
        <//>
      <//><//>
    <//>
  <//>`,

  overview: ({ toast }) => {
    const cap = (t, d, k, s, extra) => h`<${Card} size="3" key=${t}><${Flex} direction="column" gap="2" height="100%">
      <${Flex} justify="between" align="center"><${Text} weight="medium">${t}<//><${Badge} color="gray" variant="soft">啟動期<//><//>
      <${Text} size="2" color="gray">${d}<//>
      <${Box} mt="auto"><${St} kind=${k}>${s}<//><//>
      ${extra}
    <//><//>`;
    const sect = t => h`<${Text} as="div" size="2" weight="medium" color="gray" mt="4" mb="2">${t}<//>`;
    return h`<${Box}>
      <${H} sub="這些都在啟動時決定，改配置後要重啟。卡上只有狀態與檢查，沒有開關。">概覽<//>
      ${sect('datapath')}
      <${Grid} columns="3" gap="3">
        ${cap('eBPF', '直連與已決定的流在內核轉發，不進 userspace。', 'ok', 'tc 已掛在 wan0、lan0 · 路由表已發布')}
        ${cap('nfqueue', 'eBPF 不能決定的封包交 userspace 判定。', 'bad', 'nfnetlink_queue 未載入', h`<${Flex} gap="3" align="center" mt="1"><${Button} size="1" variant="soft" onClick=${() => toast('bad', '檢查完成 · 1 項失敗 · modprobe nfnetlink_queue')}><${Stethoscope} size="14" />重跑檢查<//><${Text} size="1" color="gray">requested 是 · effective 否<//><//>`)}
        ${cap('TProxy', '透明代理入口，LAN 的流量從這裡進來。', 'ok', '監聽 :12345 · mark 0x2a')}
      <//>
      ${sect('服務')}
      <${Grid} columns="3" gap="3">
        ${cap('DNS', 'honk 自己的解析器，帶快取與分流。', 'ok', '監聽 :53 · 上游 2 個 · 快取 1,204 條')}
        ${cap('Clash API', '相容層，現成面板與殼程式靠它。', 'warn', '127.0.0.1:9090 · secret 為空')}
        ${cap('原生 API', 'doona 與 honk-tool 用的介面。', 'ok', '127.0.0.1:9091 · /api/v1 · bearer')}
      <//>
      ${sect('介面')}
      <${Grid} columns="3" gap="3">
        ${cap('內嵌 doona', '在 API 監聽器上托管這個介面。', 'ok', '/ui · 0.3.0 · 與 API 同一個 origin')}
        ${cap('cache_file', '記住選擇、出站模式與 DNS 快取。', 'ok', '/var/lib/honk/cache.db · 1.2 MB')}
      <//>
    <//>`;
  },

  conns: ({ openRule, go }) => {
    const rows = [
      ['api.telegram.org:443', '10.0.0.12', 'proxy → hk-01', 'userspace', '1.2 MB', '4m 12s'],
      ['cdn.bilibili.com:443', '10.0.0.7', 'direct', '內核', '84 MB', '12m 03s'],
      ['52.84.19.3:443', '10.0.0.7', 'proxy → hk-01', '內核', '312 KB', '18s'],
      ['doubleclick.net:443', '10.0.0.31', 'block', '拒絕', '0', '—'],
      ['1.1.1.1:53', '10.0.0.12', 'direct(must)', '內核', '2 KB', '1s', 'udp'],
      ['github.com:443', '10.0.0.12', 'proxy → hk-01', 'userspace', '5.6 MB', '2m 40s'],
      ['mtalk.google.com:5228', '10.0.0.9', 'proxy → hk-01', 'userspace', '12 KB', '1h 02m'],
    ];
    const [sel, setSel] = useState(1);
    const r = rows[sel];
    return h`<${Box}>
      <${H}>連線<//>
      <${Flex} align="center" gap="3" mb="3"><${SegmentedControl.Root} size="1" defaultValue="all"><${SegmentedControl.Item} value="all">全部 47<//><${SegmentedControl.Item} value="user">userspace 8<//><${SegmentedControl.Item} value="blk">拒絕 3<//><//><${Text} size="1" color="gray">選一條，右邊是它的路由結果與能做的事。<//><//>
      <${Grid} columns="minmax(0,1fr) 320px" gap="3" align="start">
        <${Card} size="1"><${Inset}><${Table.Root} size="2">
          <${Table.Header}><${Table.Row}><${Table.ColumnHeaderCell}>目標<//><${Table.ColumnHeaderCell}>來源<//><${Table.ColumnHeaderCell}>出站<//><${Table.ColumnHeaderCell}>路徑<//><${Table.ColumnHeaderCell} align="right">流量<//><${Table.ColumnHeaderCell} align="right">時長<//><//><//>
          <${Table.Body}>${rows.map((c, i) => h`<${Table.Row} key=${i} className=${i === sel ? 'row-sel' : ''} onClick=${() => setSel(i)}>
            <${Table.Cell}>${c[0]} ${c[6] && h`<${Badge} color="gray" variant="soft" size="1">udp<//>`}<//>
            <${Table.Cell}><${Code} variant="ghost" color="gray">${c[1]}<//><//>
            <${Table.Cell}>${c[2]}<//>
            <${Table.Cell}>${c[3] === '拒絕' ? h`<${Text} color="red" size="2">拒絕<//>` : h`<${Badge} color="gray" variant="soft">${c[3]}<//>`}<//>
            <${Table.Cell} align="right">${c[4]}<//>
            <${Table.Cell} align="right"><${Text} color="gray">${c[5]}<//><//>
          <//>`)}<//>
        <//><//><//>
        <${Card} size="3"><${Flex} direction="column" gap="3">
          <${Box}><${Text} as="div" size="3" weight="bold">${r[0]}<//><${Box} mt="1"><${St} kind=${r[3] === '拒絕' ? 'bad' : 'ok'}>${r[3] === '內核' ? '內核轉發' : r[3]} · ${r[6] ? 'UDP' : 'TCP'}<//><//><//>
          <${DataList.Root} size="1">
            <${DataList.Item}><${DataList.Label}>來源<//><${DataList.Value}><${Code} variant="ghost">${r[1]}:51422<//><//><//>
            <${DataList.Item}><${DataList.Label}>解析<//><${DataList.Value}><${Code} variant="ghost">120.92.78.14<//><//><//>
            <${DataList.Item}><${DataList.Label}>命中<//><${DataList.Value}><${Code} variant="ghost">#4 domain(geosite: cn) -> direct<//><//><//>
            <${DataList.Item}><${DataList.Label}>出站<//><${DataList.Value}>${r[2]}<//><//>
            <${DataList.Item}><${DataList.Label}>流量<//><${DataList.Value}>↑ 1.1 MB ↓ 83 MB<//><//>
          <//>
          <${Separator} size="4" />
          <${Flex} direction="column" gap="2">
            <${Button} variant="soft" color="gray" onClick=${() => openRule('domain(suffix: ' + r[0].split(':')[0].split('.').slice(-2).join('.') + ')')}><${Flex} justify="between" width="100%"><span>為 ${r[0].split(':')[0]} 加規則</span><${Kbd}>R<//><//><//>
